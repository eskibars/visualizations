<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="color-scheme" content="dark"/>
  <title>Ink Currents</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #04050c; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .vignette {
      pointer-events: none; position: fixed; inset: 0;
      background: radial-gradient(ellipse 120% 100% at 50% 50%,
        rgba(0,0,0,0) 40%, rgba(0,0,0,.42) 82%, rgba(0,0,0,.85) 100%);
    }
    .caption {
      pointer-events: none; position: fixed; left: 0; right: 0; bottom: 3.4vh;
      text-align: center;
      font: 500 clamp(9px, .68vw, 13px)/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .34em; text-transform: uppercase;
      color: rgba(214, 228, 255, .30);
      text-shadow: 0 1px 14px rgba(0,0,0,.95);
      opacity: 0; transition: opacity 3s ease 2s;
    }
    body.ready .caption { opacity: 1; }
    .nogl {
      display: none; position: fixed; inset: 0; place-items: center;
      color: #8b93a8; font: 14px system-ui; letter-spacing: .08em;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="vignette"></div>
  <div class="caption">ink currents · navier–stokes</div>
  <div class="nogl" id="nogl">WebGL2 float buffers unavailable</div>
<script>
(() => {
  "use strict";

  window.addEventListener('error', (e) => {
    window.__jserr = e.message + ' @line ' + e.lineno;
  });

  // ============================================================
  //  INK CURRENTS — GPU Navier–Stokes (stable fluids): advect,
  //  vorticity confinement, Jacobi pressure solve, dye transport.
  //
  //  It drives itself: three wandering emitters sweep slow
  //  Lissajous paths, stirring dye that is advected into filaments
  //  and curls. Pointer movement stirs too, but nothing needs it.
  // ============================================================
  const CONFIG = {
    dprCap: 1.5,
    simRes: 144,          // velocity grid (short side)
    dyeRes: 1024,         // dye grid (short side)
    pressureIterations: 20,

    densityDissipation: 0.32,  // /s — ink lingers, slowly thinning
    velocityDissipation: 0.28,
    curl: 22,                  // vorticity confinement strength
    pressure: 0.8,             // pressure reuse between frames

    splatRadius: 0.28,         // fraction of canvas (divided by 100 in the shader)
    splatForce: 5200,

    emitters: 3,
    emitterSpeed: 0.35,        // rad/s on the Lissajous phases
    emitterInk: 2.1,           // dye per second at each emitter core
    burstEvery: [3.5, 7],      // s — random cross-current splats

    // dye hues (degrees) the emitters cycle through
    hues: [188, 208, 276, 322, 42, 158],
    bg: [0.012, 0.014, 0.028],
  };

  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl2', {
    alpha: false, antialias: false, depth: false, stencil: false,
    powerPreference: 'high-performance',
  });
  if (!gl) { document.getElementById('nogl').style.display = 'grid'; return; }
  if (!gl.getExtension('EXT_color_buffer_float')) {
    document.getElementById('nogl').style.display = 'grid'; return;
  }
  gl.getExtension('OES_texture_float_linear');

  // -------------------- shaders --------------------
  const VERT = `#version 300 es
  in vec2 aPos;
  out vec2 vUv;
  out vec2 vL; out vec2 vR; out vec2 vT; out vec2 vB;
  uniform vec2 uTexel;
  void main() {
    vUv = aPos * 0.5 + 0.5;
    vL = vUv - vec2(uTexel.x, 0.0);
    vR = vUv + vec2(uTexel.x, 0.0);
    vT = vUv + vec2(0.0, uTexel.y);
    vB = vUv - vec2(0.0, uTexel.y);
    gl_Position = vec4(aPos, 0.0, 1.0);
  }`;

  const FRAG_ADVECT = `#version 300 es
  precision highp float;
  in vec2 vUv;
  out vec4 outColor;
  uniform sampler2D uVelocity;
  uniform sampler2D uSource;
  uniform vec2 uTexel;
  uniform float uDt;
  uniform float uDissipation;
  void main() {
    // semi-Lagrangian backtrace; hardware bilinear on the 16F textures
    vec2 coord = vUv - uDt * texture(uVelocity, vUv).xy * uTexel;
    vec4 result = texture(uSource, coord);
    result /= 1.0 + uDissipation * uDt;
    outColor = result;
  }`;

  const FRAG_DIVERGENCE = `#version 300 es
  precision highp float;
  in vec2 vUv; in vec2 vL; in vec2 vR; in vec2 vT; in vec2 vB;
  out vec4 outColor;
  uniform sampler2D uVelocity;
  void main() {
    float L = texture(uVelocity, vL).x;
    float R = texture(uVelocity, vR).x;
    float T = texture(uVelocity, vT).y;
    float B = texture(uVelocity, vB).y;
    vec2 C = texture(uVelocity, vUv).xy;
    if (vL.x < 0.0) { L = -C.x; }
    if (vR.x > 1.0) { R = -C.x; }
    if (vT.y > 1.0) { T = -C.y; }
    if (vB.y < 0.0) { B = -C.y; }
    outColor = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0);
  }`;

  const FRAG_CURL = `#version 300 es
  precision highp float;
  in vec2 vUv; in vec2 vL; in vec2 vR; in vec2 vT; in vec2 vB;
  out vec4 outColor;
  uniform sampler2D uVelocity;
  void main() {
    float L = texture(uVelocity, vL).y;
    float R = texture(uVelocity, vR).y;
    float T = texture(uVelocity, vT).x;
    float B = texture(uVelocity, vB).x;
    outColor = vec4(0.5 * ((R - L) - (T - B)), 0.0, 0.0, 1.0);
  }`;

  const FRAG_VORTICITY = `#version 300 es
  precision highp float;
  in vec2 vUv; in vec2 vL; in vec2 vR; in vec2 vT; in vec2 vB;
  out vec4 outColor;
  uniform sampler2D uVelocity;
  uniform sampler2D uCurl;
  uniform float uCurlStrength;
  uniform float uDt;
  void main() {
    float L = texture(uCurl, vL).x;
    float R = texture(uCurl, vR).x;
    float T = texture(uCurl, vT).x;
    float B = texture(uCurl, vB).x;
    float C = texture(uCurl, vUv).x;
    vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
    force /= length(force) + 0.0001;
    force *= uCurlStrength * C;
    force.y *= -1.0;
    vec2 vel = texture(uVelocity, vUv).xy;
    vel += force * uDt;
    vel = min(max(vel, -1000.0), 1000.0);
    outColor = vec4(vel, 0.0, 1.0);
  }`;

  const FRAG_PRESSURE = `#version 300 es
  precision highp float;
  in vec2 vUv; in vec2 vL; in vec2 vR; in vec2 vT; in vec2 vB;
  out vec4 outColor;
  uniform sampler2D uPressure;
  uniform sampler2D uDivergence;
  void main() {
    float L = texture(uPressure, vL).x;
    float R = texture(uPressure, vR).x;
    float T = texture(uPressure, vT).x;
    float B = texture(uPressure, vB).x;
    float divergence = texture(uDivergence, vUv).x;
    float pressure = (L + R + B + T - divergence) * 0.25;
    outColor = vec4(pressure, 0.0, 0.0, 1.0);
  }`;

  const FRAG_GRADIENT_SUBTRACT = `#version 300 es
  precision highp float;
  in vec2 vUv; in vec2 vL; in vec2 vR; in vec2 vT; in vec2 vB;
  out vec4 outColor;
  uniform sampler2D uPressure;
  uniform sampler2D uVelocity;
  void main() {
    float L = texture(uPressure, vL).x;
    float R = texture(uPressure, vR).x;
    float T = texture(uPressure, vT).x;
    float B = texture(uPressure, vB).x;
    vec2 velocity = texture(uVelocity, vUv).xy;
    velocity.xy -= vec2(R - L, T - B);
    outColor = vec4(velocity, 0.0, 1.0);
  }`;

  const FRAG_SPLAT = `#version 300 es
  precision highp float;
  in vec2 vUv;
  out vec4 outColor;
  uniform sampler2D uTarget;
  uniform float uAspect;
  uniform vec3 uColor;
  uniform vec2 uPoint;
  uniform float uRadius;
  void main() {
    vec2 p = vUv - uPoint;
    p.x *= uAspect;
    vec3 splat = exp(-dot(p, p) / uRadius) * uColor;
    vec3 base = texture(uTarget, vUv).xyz;
    outColor = vec4(base + splat, 1.0);
  }`;

  const FRAG_CLEAR = `#version 300 es
  precision highp float;
  in vec2 vUv;
  out vec4 outColor;
  uniform sampler2D uTexture;
  uniform float uValue;
  void main() {
    outColor = uValue * texture(uTexture, vUv);
  }`;

  const FRAG_DISPLAY = `#version 300 es
  precision highp float;
  in vec2 vUv; in vec2 vL; in vec2 vR; in vec2 vT; in vec2 vB;
  out vec4 outColor;
  uniform sampler2D uTexture;
  uniform vec3 uBg;
  void main() {
    vec3 c = texture(uTexture, vUv).rgb;
    // gel shading from the dye gradient
    vec3 lc = texture(uTexture, vL).rgb;
    vec3 rc = texture(uTexture, vR).rgb;
    vec3 tc = texture(uTexture, vT).rgb;
    vec3 bc = texture(uTexture, vB).rgb;
    float dx = length(rc) - length(lc);
    float dy = length(tc) - length(bc);
    vec3 n = normalize(vec3(dx * 0.32, dy * 0.32, length(c) * 0.35 + 0.42));
    vec3 l = normalize(vec3(0.35, 0.5, 0.9));
    float diffuse = clamp(dot(n, l) + 0.80, 0.80, 1.18);
    float spec = pow(clamp(dot(reflect(-l, n), vec3(0.0, 0.0, 1.0)), 0.0, 1.0), 48.0) * 0.08;
    c = uBg + c * diffuse + spec * (0.25 + length(c));
    outColor = vec4(c, 1.0);
  }`;

  // -------------------- GL plumbing --------------------
  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      window.__err = gl.getShaderInfoLog(s);
      console.error(window.__err);
      return null;
    }
    return s;
  }
  function program(fragSrc) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fragSrc));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      window.__errLink = gl.getProgramInfoLog(p);
      console.error(window.__errLink);
      return null;
    }
    const uniforms = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const name = gl.getActiveUniform(p, i).name;
      uniforms[name] = gl.getUniformLocation(p, name);
    }
    return { program: p, uniforms };
  }

  const progs = {
    advect: program(FRAG_ADVECT),
    divergence: program(FRAG_DIVERGENCE),
    curl: program(FRAG_CURL),
    vorticity: program(FRAG_VORTICITY),
    pressure: program(FRAG_PRESSURE),
    gradientSub: program(FRAG_GRADIENT_SUBTRACT),
    splat: program(FRAG_SPLAT),
    clear: program(FRAG_CLEAR),
    display: program(FRAG_DISPLAY),
  };
  for (const k in progs) if (!progs[k]) {
    document.getElementById('nogl').style.display = 'grid';
    return;
  }

  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  function createFBO(w, h, filter) {
    const texture = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    return {
      texture, fbo, w, h,
      texel: [1 / w, 1 / h],
      attach(id) {
        gl.activeTexture(gl.TEXTURE0 + id);
        gl.bindTexture(gl.TEXTURE_2D, texture);
        return id;
      },
    };
  }
  function createDoubleFBO(w, h, filter) {
    return { read: createFBO(w, h, filter), write: createFBO(w, h, filter), swap() { const t = this.read; this.read = this.write; this.write = t; } };
  }

  function fboRes(base, aspect) {
    if (aspect >= 1) return [Math.round(base * aspect), base];
    return [base, Math.round(base / aspect)];
  }

  let dye, velocity, divergence, curlFBO, pressure;
  let canvasW = 0, canvasH = 0;

  function initFramebuffers() {
    const dpr = Math.min(CONFIG.dprCap, window.devicePixelRatio || 1);
    canvasW = Math.floor(window.innerWidth * dpr);
    canvasH = Math.floor(window.innerHeight * dpr);
    canvas.width = canvasW;
    canvas.height = canvasH;
    const aspect = canvasW / canvasH;
    const filter = gl.LINEAR;

    const [vw, vh] = fboRes(CONFIG.simRes, aspect);
    const [dw, dh] = fboRes(CONFIG.dyeRes, aspect);
    velocity = createDoubleFBO(vw, vh, filter);
    dye = createDoubleFBO(dw, dh, filter);
    divergence = createFBO(vw, vh, gl.NEAREST);
    curlFBO = createFBO(vw, vh, gl.NEAREST);
    pressure = createDoubleFBO(vw, vh, gl.NEAREST);
  }

  function blit(target) {
    if (target == null) {
      gl.viewport(0, 0, canvasW, canvasH);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } else {
      gl.viewport(0, 0, target.w, target.h);
      gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
    }
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function useProg(p) { gl.useProgram(p.program); return p; }

  // -------------------- splats --------------------
  function splat(x, y, dx, dy, color, radiusScale = 1) {
    const p = useProg(progs.splat);
    gl.uniform1i(p.uniforms.uTarget, velocity.read.attach(0));
    gl.uniform1f(p.uniforms.uAspect, canvasW / canvasH);
    gl.uniform2f(p.uniforms.uPoint, x, y);
    gl.uniform3f(p.uniforms.uColor, dx, dy, 0.0);
    gl.uniform1f(p.uniforms.uRadius, correctRadius(CONFIG.splatRadius * radiusScale) / 100.0);
    blit(velocity.write); velocity.swap();

    gl.uniform1i(p.uniforms.uTarget, dye.read.attach(0));
    gl.uniform3f(p.uniforms.uColor, color.r, color.g, color.b);
    blit(dye.write); dye.swap();
  }
  function correctRadius(radius) {
    const aspect = canvasW / canvasH;
    return aspect > 1 ? radius * aspect : radius;
  }

  function hsvToRgb(h, s, v) {
    h = ((h % 360) + 360) % 360;
    const c = v * s;
    const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    const m = v - c;
    let r, g, b;
    if (h < 60) { r = c; g = x; b = 0; }
    else if (h < 120) { r = x; g = c; b = 0; }
    else if (h < 180) { r = 0; g = c; b = x; }
    else if (h < 240) { r = 0; g = x; b = c; }
    else if (h < 300) { r = x; g = 0; b = c; }
    else { r = c; g = 0; b = x; }
    return { r: (r + m), g: (g + m), b: (b + m) };
  }

  // -------------------- autonomous emitters --------------------
  const emitters = [];
  for (let i = 0; i < CONFIG.emitters; i++) {
    const ang = (i / CONFIG.emitters) * Math.PI * 2 + Math.random() * 0.8;
    emitters.push({
      cx: 0.5 + 0.16 * Math.cos(ang),        // roam distinct regions
      cy: 0.5 + 0.16 * Math.sin(ang),
      ax: 0.24 + 0.10 * Math.random(),      // x sweep amplitude
      ay: 0.22 + 0.10 * Math.random(),
      wx: (0.5 + Math.random()) * (Math.random() < 0.5 ? 1 : -1),
      wy: (0.5 + Math.random()) * (Math.random() < 0.5 ? 1 : -1),
      px: Math.random() * Math.PI * 2,
      py: Math.random() * Math.PI * 2,
      hueIdx: i,
      hueDrift: 6 + Math.random() * 8,     // deg/s of slow hue travel
    });
  }
  let hueBase = 0;
  let nextBurst = 2 + Math.random() * (CONFIG.burstEvery[1] - CONFIG.burstEvery[0]);

  function emitterPos(e, time) {
    return {
      x: e.cx + e.ax * Math.sin(time * e.wx * CONFIG.emitterSpeed * 2 + e.px),
      y: e.cy + e.ay * Math.sin(time * e.wy * CONFIG.emitterSpeed * 2 + e.py),
    };
  }

  function stepEmitters(dt, time) {
    for (const e of emitters) {
      const pos = emitterPos(e, time);
      const prev = emitterPos(e, time - dt);   // per-frame drag, like a brush
      const dx = (pos.x - prev.x) * CONFIG.splatForce * 1.2;
      const dy = (pos.y - prev.y) * CONFIG.splatForce * 1.2;
      const hue = CONFIG.hues[e.hueIdx % CONFIG.hues.length] + hueBase + time * e.hueDrift;
      const rgb = hsvToRgb(hue, 0.95, 1.0);
      const k = CONFIG.emitterInk * dt;   // frame-rate independent ink rate
      splat(pos.x, pos.y, dx, dy, { r: rgb.r * k, g: rgb.g * k, b: rgb.b * k }, 0.85);
    }
    hueBase += dt * 3.2;
  }

  function randomBurst() {
    const x = 0.15 + Math.random() * 0.7;
    const y = 0.15 + Math.random() * 0.7;
    const hue = CONFIG.hues[(Math.random() * CONFIG.hues.length) | 0] + hueBase;
    const col = hsvToRgb(hue, 0.95, 0.5);
    const angle = Math.random() * Math.PI * 2;
    const force = CONFIG.splatForce * (0.8 + Math.random() * 1.6);
    splat(x, y, Math.cos(angle) * force, Math.sin(angle) * force, col, 1.8);
    if (Math.random() < 0.5) {
      const hue2 = hue + 60 + Math.random() * 120;
      const col2 = hsvToRgb(hue2, 0.9, 0.45);
      splat(x, y, -Math.cos(angle) * force * 0.7, -Math.sin(angle) * force * 0.7, col2, 1.4);
    }
  }

  // -------------------- pointer (optional stirring) --------------------
  const pointer = { x: 0.5, y: 0.5, dx: 0, dy: 0, moved: false, hue: 190 };
  window.addEventListener('pointermove', (e) => {
    const x = e.clientX / window.innerWidth;
    const y = 1 - e.clientY / window.innerHeight;
    if (pointer.moved) {
      pointer.dx = (x - pointer.x) * CONFIG.splatForce;
      pointer.dy = (y - pointer.y) * CONFIG.splatForce;
      pointer.hue += Math.hypot(pointer.dx, pointer.dy) * 0.004;
    }
    pointer.x = x; pointer.y = y; pointer.moved = true;
  }, { passive: true });

  // -------------------- simulation step --------------------
  function step(dt) {
    useProg(progs.curl);
    gl.uniform2f(progs.curl.uniforms.uTexel, velocity.read.texel[0], velocity.read.texel[1]);
    gl.uniform1i(progs.curl.uniforms.uVelocity, velocity.read.attach(0));
    blit(curlFBO);

    useProg(progs.vorticity);
    gl.uniform2f(progs.vorticity.uniforms.uTexel, velocity.read.texel[0], velocity.read.texel[1]);
    gl.uniform1i(progs.vorticity.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(progs.vorticity.uniforms.uCurl, curlFBO.attach(1));
    gl.uniform1f(progs.vorticity.uniforms.uCurlStrength, CONFIG.curl);
    gl.uniform1f(progs.vorticity.uniforms.uDt, dt);
    blit(velocity.write); velocity.swap();

    useProg(progs.divergence);
    gl.uniform2f(progs.divergence.uniforms.uTexel, velocity.read.texel[0], velocity.read.texel[1]);
    gl.uniform1i(progs.divergence.uniforms.uVelocity, velocity.read.attach(0));
    blit(divergence);

    useProg(progs.clear);
    gl.uniform1i(progs.clear.uniforms.uTexture, pressure.read.attach(0));
    gl.uniform1f(progs.clear.uniforms.uValue, CONFIG.pressure);
    blit(pressure.write); pressure.swap();

    useProg(progs.pressure);
    gl.uniform2f(progs.pressure.uniforms.uTexel, velocity.read.texel[0], velocity.read.texel[1]);
    gl.uniform1i(progs.pressure.uniforms.uDivergence, divergence.attach(1));
    for (let i = 0; i < CONFIG.pressureIterations; i++) {
      gl.uniform1i(progs.pressure.uniforms.uPressure, pressure.read.attach(0));
      blit(pressure.write); pressure.swap();
    }

    useProg(progs.gradientSub);
    gl.uniform2f(progs.gradientSub.uniforms.uTexel, velocity.read.texel[0], velocity.read.texel[1]);
    gl.uniform1i(progs.gradientSub.uniforms.uPressure, pressure.read.attach(0));
    gl.uniform1i(progs.gradientSub.uniforms.uVelocity, velocity.read.attach(1));
    blit(velocity.write); velocity.swap();

    useProg(progs.advect);
    gl.uniform2f(progs.advect.uniforms.uTexel, velocity.read.texel[0], velocity.read.texel[1]);
    const velId = velocity.read.attach(0);
    gl.uniform1i(progs.advect.uniforms.uVelocity, velId);
    gl.uniform1i(progs.advect.uniforms.uSource, velId);
    gl.uniform1f(progs.advect.uniforms.uDt, dt);
    gl.uniform1f(progs.advect.uniforms.uDissipation, CONFIG.velocityDissipation);
    blit(velocity.write); velocity.swap();

    gl.uniform2f(progs.advect.uniforms.uTexel, dye.read.texel[0], dye.read.texel[1]);
    gl.uniform1i(progs.advect.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(progs.advect.uniforms.uSource, dye.read.attach(1));
    gl.uniform1f(progs.advect.uniforms.uDissipation, CONFIG.densityDissipation);
    blit(dye.write); dye.swap();
  }

  function render() {
    const p = useProg(progs.display);
    gl.uniform2f(p.uniforms.uTexel, dye.read.texel[0], dye.read.texel[1]);
    gl.uniform1i(p.uniforms.uTexture, dye.read.attach(0));
    gl.uniform3f(p.uniforms.uBg, CONFIG.bg[0], CONFIG.bg[1], CONFIG.bg[2]);
    blit(null);
  }

  // -------------------- loop --------------------
  window.addEventListener('resize', () => initFramebuffers(), { passive: true });
  initFramebuffers();

  // ?turbo advances the sim faster than real time (handy for
  // screenshots); it changes speed, not the look.
  const params = new URLSearchParams(location.search);
  const turbo = params.has('turbo') ? Math.min(10, Number(params.get('turbo')) || 8) : 1;

  let last = performance.now();
  let ready = false;

  function frame(now) {
    window.__frames = (window.__frames || 0) + 1;
    const dtMs = now - last;
    last = now;
    const dt = Math.min(0.0166, dtMs / 1000) * turbo;
    const time = now / 1000;

    if (dt > 0) {
      stepEmitters(dt, time);
      if (pointer.moved && (Math.abs(pointer.dx) > 8 || Math.abs(pointer.dy) > 8)) {
        pointer.hue = pointer.hue || 190;
        const col = hsvToRgb(pointer.hue, 0.9, 0.35);
        splat(pointer.x, pointer.y, pointer.dx, pointer.dy, col, 1.0);
        pointer.dx = 0; pointer.dy = 0;
      }
      nextBurst -= dt;
      if (nextBurst <= 0) {
        randomBurst();
        nextBurst = CONFIG.burstEvery[0] + Math.random() * (CONFIG.burstEvery[1] - CONFIG.burstEvery[0]);
      }
      step(dt);
    }
    render();

    if (!ready) { ready = true; document.body.classList.add('ready'); }
    requestAnimationFrame(frame);
  }

  // prime with a few colourful bursts so the first paint is alive
  for (let i = 0; i < 6; i++) {
    const hue = CONFIG.hues[i % CONFIG.hues.length] + Math.random() * 40;
    const col = hsvToRgb(hue, 0.95, 0.5);
    splat(0.2 + Math.random() * 0.6, 0.2 + Math.random() * 0.6,
      (Math.random() - 0.5) * 9000, (Math.random() - 0.5) * 9000, col, 1.6);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
