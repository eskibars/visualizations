<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="color-scheme" content="dark"/>
  <title>Jerusalem Night</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #050817; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .vignette {
      pointer-events: none; position: fixed; inset: 0;
      background: radial-gradient(ellipse 126% 100% at 46% 40%,
        rgba(0,0,0,0) 40%, rgba(0,0,0,.36) 82%, rgba(0,0,0,.8) 100%);
    }
    .caption {
      pointer-events: none; position: fixed; left: 0; right: 0; bottom: 3.4vh;
      text-align: center;
      font: 500 clamp(9px, .68vw, 13px)/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .34em; text-transform: uppercase;
      color: rgba(255, 214, 150, .27);
      text-shadow: 0 1px 14px rgba(0,0,0,.95);
      opacity: 0; transition: opacity 3s ease 2s;
    }
    body.ready .caption { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="vignette"></div>
  <div class="caption">the old city keeps the feast</div>
<script>
(() => {
  "use strict";

  // ============================================================
  //  JERUSALEM NIGHT — the Old City on its hills under a waning
  //  crescent. The stars wheel slowly around a southern pole;
  //  the Dome of the Rock holds a faint moonlight of its own;
  //  and in the houses below the rampart, candles gutter and
  //  relight behind the windows, one by one, all night.
  //
  //  Construction notes
  //  ------------------
  //  The skyline — far ridges, rampart with crenellations, the
  //  dome, houses, towers and cypresses — is drawn once per
  //  resize into a static layer; window positions are recorded
  //  as they are painted so the flames can live behind them.
  //  Stars are a precomputed field rotated per frame about a
  //  pole well below the frame, so the sky turns rather than
  //  slides. Every flame is the shared glow sprite plus a
  //  candle-flicker like the other pieces use.
  // ============================================================
  const CONFIG = {
    dprCap: 1.6,

    moon: { x: 0.775, y: 0.155, r: 0.030 },

    stars: 210,
    starTurn: 0.0045,        // rad/s — a full circuit in ~23 minutes

    windows: 30,
    cloudSpeed: 10,
  };

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  let W = 0, H = 0, DPR = 1, U = 1;

  function rand(a, b) { return a + Math.random() * (b - a); }

  function noise1(x) {
    const i = Math.floor(x), f = x - i;
    const h = (n) => {
      const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
      return s - Math.floor(s);
    };
    const u = f * f * f * (f * (f * 6 - 15) + 10);
    return h(i) * (1 - u) + h(i + 1) * u;
  }
  const fbm1 = (x) => 0.6 * noise1(x) + 0.4 * noise1(x * 2.13 + 7.7);

  // -------------------- sprites --------------------
  function makeGlow(r, g, b) {
    const s = 128, c = document.createElement('canvas');
    c.width = c.height = s;
    const g2 = c.getContext('2d');
    const grad = g2.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    grad.addColorStop(0, `rgba(${r},${g},${b},1)`);
    grad.addColorStop(0.25, `rgba(${r},${g},${b},.55)`);
    grad.addColorStop(0.6, `rgba(${r},${g},${b},.16)`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    g2.fillStyle = grad;
    g2.fillRect(0, 0, s, s);
    return c;
  }
  const glowFlame = makeGlow(255, 196, 110);
  const glowDome = makeGlow(232, 214, 165);

  function stamp(sprite, x, y, size, alpha) {
    if (alpha <= 0.004) return;
    ctx.globalAlpha = Math.min(1, alpha);
    ctx.drawImage(sprite, x - size / 2, y - size / 2, size, size);
    ctx.globalAlpha = 1;
  }

  // -------------------- stars --------------------
  let stars = [];
  function buildStars() {
    stars = [];
    for (let i = 0; i < CONFIG.stars; i++) {
      stars.push({
        // polar coordinates about the wheel pole, annulus chosen
        // so the visible sky band is densely covered
        a: Math.random() * Math.PI * 2,
        d: H * (1.35 + Math.pow(Math.random(), 0.8) * 0.9),
        m: rand(0.3, 1),
        tw: rand(0.4, 1.8), ph: rand(0, Math.PI * 2),
      });
    }
  }
  function drawStars(time) {
    const poleX = W * 0.5, poleY = H * 1.9;
    for (const s of stars) {
      const a = s.a + time * CONFIG.starTurn * (0.7 + 0.3 * s.m);
      const x = poleX + Math.cos(a) * s.d * 1.25;
      const y = poleY + Math.sin(a) * s.d;
      if (x < -8 || x > W + 8 || y < -8 || y > H * 0.66) continue;
      const tw = 0.3 + 0.7 * Math.sin(time * s.tw * Math.PI * 2 + s.ph);
      const a2 = Math.max(0.04, s.m * tw) * (1 - Math.max(0, y / (H * 0.68)) * 0.4);
      ctx.fillStyle = `rgba(220, 231, 255, ${a2.toFixed(3)})`;
      const sz = s.m > 0.8 ? 2 * U : 1.4 * U;
      ctx.fillRect(x, y, sz, sz);
    }
  }

  // -------------------- static sky + city --------------------
  let bgLayer, cityLayer;
  let windows = [];   // recorded while painting

  function paintSkyBg() {
    bgLayer = document.createElement('canvas');
    bgLayer.width = Math.floor(W * DPR); bgLayer.height = Math.floor(H * DPR);
    const g = bgLayer.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    const sky = g.createLinearGradient(0, 0, 0, H * 0.8);
    sky.addColorStop(0, '#050816');
    sky.addColorStop(0.55, '#0a1128');
    sky.addColorStop(1, '#101a36');
    g.fillStyle = sky;
    g.fillRect(0, 0, W, H);
    paintMoonInto(g);
  }

  function paintCity() {
    cityLayer = document.createElement('canvas');
    cityLayer.width = Math.floor(W * DPR); cityLayer.height = Math.floor(H * DPR);
    const g = cityLayer.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    windows = [];

    // ---- far hazy ridges ----
    // (the night-sky gradient lives in bgLayer; this layer holds
    // only city silhouettes, so the stars can turn behind them)
    g.fillStyle = '#131e3a';
    ridge(g, H * 0.50, H * 0.030, 2.1);
    g.fillStyle = '#0e1630';
    ridge(g, H * 0.565, H * 0.022, 5.4);

    // ---- the wall line steps across the mid ridge ----
    const wallBase = (x) => {
      const t = x / W;
      return H * 0.645 + Math.sin(t * 4.2 + 1.2) * H * 0.012 + noise1(t * 5 + 2) * H * 0.008;
    };

    // ---- houses below the wall: two rows of stepped boxes ----
    g.fillStyle = '#101a36';
    for (let i = 0; i < 34; i++) {
      const x = rand(-0.02, 1.0) * W;
      const bw = rand(0.030, 0.075) * W;
      const bh = rand(0.030, 0.070) * H;
      const by = wallBase(x + bw / 2) + rand(0.012, 0.05) * H + bh;
      g.fillRect(x, by - bh, bw, bh + H);
      // little dome on some roofs
      if (Math.random() < 0.4) {
        g.beginPath();
        g.ellipse(x + bw / 2, by - bh, bw * 0.26, bw * 0.13, 0, Math.PI, 0);
        g.fill();
      }
      // record windows
      const nWin = 1 + (Math.random() * 2.4 | 0);
      for (let k = 0; k < nWin; k++) {
        windows.push({
          x: x + rand(0.2, 0.8) * bw,
          y: by - bh + rand(0.25, 0.75) * bh,
          w: rand(2.2, 4.2) * U, h: rand(3, 5.5) * U,
          ph: rand(0, Math.PI * 2),
          jx: rand(3, 8), jy: rand(1.6, 3.6),
          off: 0, offT: 0,
          state: 1,
        });
      }
    }

    // ---- the city block under the dome rises above the wall ----
    g.fillStyle = '#0d142b';
    const platX = W * 0.315, platW = W * 0.185, platY = wallBase(W * 0.41) - H * 0.052;
    g.fillRect(platX, platY, platW, H - platY);

    // colonnade shadow line along the platform
    g.fillStyle = '#0a1124';
    for (let i = 0; i < 9; i++) {
      g.fillRect(platX + 6 * U + i * (platW - 12 * U) / 9, platY + H * 0.008, 3 * U, H * 0.02);
    }

    // ---- the Dome of the Rock ----
    const dcx = W * 0.4075, dBase = platY + H * 0.006;
    // octagonal drum
    g.fillStyle = '#0c1329';
    g.fillRect(dcx - W * 0.052, dBase - H * 0.062, W * 0.104, H * 0.062);
    // drum's moonlit face
    const drum = g.createLinearGradient(dcx - W * 0.05, 0, dcx + W * 0.05, 0);
    drum.addColorStop(0, 'rgba(96, 96, 118, 0)');
    drum.addColorStop(0.55, 'rgba(150, 148, 158, .34)');
    drum.addColorStop(1, 'rgba(96, 96, 118, 0)');
    g.fillStyle = drum;
    g.fillRect(dcx - W * 0.05, dBase - H * 0.062, W * 0.1, H * 0.05);
    // arches row on the drum
    g.fillStyle = 'rgba(10, 15, 30, .8)';
    for (let i = 0; i < 7; i++) {
      const ax = dcx - W * 0.042 + i * (W * 0.084) / 6;
      g.beginPath();
      g.arc(ax, dBase - H * 0.044, 3.4 * U, Math.PI, 0);
      g.fillRect(ax - 3.4 * U, dBase - H * 0.044, 6.8 * U, H * 0.022);
      g.fill();
    }
    // the dome itself, holding a little light of its own
    const dr = W * 0.058;
    const dcy = dBase - H * 0.062;
    const halo = g.createRadialGradient(dcx, dcy - dr * 0.2, dr * 0.3, dcx, dcy - dr * 0.2, dr * 2.6);
    halo.addColorStop(0, 'rgba(236, 216, 168, .30)');
    halo.addColorStop(0.5, 'rgba(230, 208, 156, .10)');
    halo.addColorStop(1, 'rgba(230, 208, 156, 0)');
    g.fillStyle = halo;
    g.fillRect(dcx - dr * 2.6, dcy - dr * 2.8, dr * 5.2, dr * 5.2);

    const dome = g.createRadialGradient(dcx - dr * 0.25, dcy - dr * 0.5, dr * 0.15, dcx, dcy, dr);
    dome.addColorStop(0, '#efe0b4');
    dome.addColorStop(0.55, '#c8ab72');
    dome.addColorStop(1, '#6e5a38');
    g.fillStyle = dome;
    g.beginPath();
    g.ellipse(dcx, dcy, dr, dr * 0.86, 0, Math.PI, 0);
    g.quadraticCurveTo(dcx, dcy + dr * 0.22, dcx - dr, dcy);
    g.fill();
    // finial
    g.strokeStyle = '#c8ab72';
    g.lineWidth = Math.max(1, 2 * U);
    g.beginPath();
    g.moveTo(dcx, dcy - dr * 0.86);
    g.lineTo(dcx, dcy - dr * 1.12);
    g.stroke();

    // ---- rampart with crenellations ----
    g.fillStyle = '#0d1530';
    g.beginPath();
    g.moveTo(-2, H + 2);
    for (let x = -2; x <= W + 2; x += 8) g.lineTo(x, wallBase(x));
    g.lineTo(W + 2, H + 2);
    g.closePath();
    g.fill();
    g.fillStyle = '#111b38';
    for (let x = W * 0.14; x < W * 0.88; x += 15 * U) {
      const y = wallBase(x);
      g.fillRect(x, y - 6.5 * U, 8.5 * U, 7.5 * U);
    }

    // ---- towers: one square keep, one minaret ----
    const kx = W * 0.235, ky = wallBase(kx);
    g.fillStyle = '#0c1329';
    g.fillRect(kx - W * 0.014, ky - H * 0.085, W * 0.028, H * 0.085);
    g.fillRect(kx - W * 0.017, ky - H * 0.092, W * 0.034, H * 0.012);
    windows.push({ x: kx, y: ky - H * 0.06, w: 3 * U, h: 4.5 * U, ph: rand(0, 6), jx: 5, jy: 2.4, off: 0, offT: 0, state: 1 });
    windows.push({ x: kx - W * 0.007, y: ky - H * 0.03, w: 2.4 * U, h: 3.6 * U, ph: rand(0, 6), jx: 6, jy: 3, off: 0, offT: 0, state: 1 });

    const mx2 = W * 0.615, my2 = wallBase(mx2);
    g.fillStyle = '#0c1329';
    g.fillRect(mx2 - W * 0.0055, my2 - H * 0.145, W * 0.011, H * 0.145);
    g.fillRect(mx2 - W * 0.009, my2 - H * 0.118, W * 0.018, H * 0.012);   // balcony
    g.beginPath();                                                         // cone
    g.moveTo(mx2 - W * 0.009, my2 - H * 0.145);
    g.lineTo(mx2, my2 - H * 0.185);
    g.lineTo(mx2 + W * 0.009, my2 - H * 0.145);
    g.closePath();
    g.fill();
    windows.push({ x: mx2, y: my2 - H * 0.1, w: 2.2 * U, h: 3.4 * U, ph: rand(0, 6), jx: 4.5, jy: 2.8, off: 0, offT: 0, state: 1 });

    // ---- foreground slope and cypresses ----
    g.fillStyle = '#060b18';
    g.beginPath();
    g.moveTo(-2, H + 2);
    for (let x = -2; x <= W + 2; x += 9) {
      const t = x / W;
      g.lineTo(x, H * 0.78 + Math.sin(t * 3.1 + 0.6) * H * 0.02 + noise1(t * 4 + 7) * H * 0.015);
    }
    g.lineTo(W + 2, H + 2);
    g.closePath();
    g.fill();

    for (const [cx, cy, ch] of [
      [0.075, 0.815, 0.16], [0.115, 0.83, 0.115], [0.9, 0.80, 0.14], [0.945, 0.825, 0.105], [0.55, 0.845, 0.09],
    ]) {
      const bx2 = cx * W, by2 = cy * H, h2 = ch * H;
      g.fillStyle = '#050a14';
      g.beginPath();
      g.moveTo(bx2 - h2 * 0.11, by2);
      g.quadraticCurveTo(bx2 - h2 * 0.13, by2 - h2 * 0.55, bx2, by2 - h2);
      g.quadraticCurveTo(bx2 + h2 * 0.13, by2 - h2 * 0.55, bx2 + h2 * 0.11, by2);
      g.closePath();
      g.fill();
    }
  }

  function ridge(g, baseY, amp, seed) {
    g.beginPath();
    g.moveTo(-2, H + 2);
    for (let x = -2; x <= W + 2; x += 8) {
      const t = x / W;
      g.lineTo(x, baseY - Math.abs(Math.sin(t * 5.3 + seed)) * amp - noise1(t * 3.5 + seed) * amp * 0.8);
    }
    g.lineTo(W + 2, H + 2);
    g.closePath();
    g.fill();
  }

  // -------------------- moon --------------------
  // crescent built on its own canvas: bright disc, then the
  // offset dark disc punched out with destination-out
  function paintMoonInto(layerCtx) {
    const mx = W * CONFIG.moon.x, my = H * CONFIG.moon.y, mr = W * CONFIG.moon.r;
    const halo = layerCtx.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 5);
    halo.addColorStop(0, 'rgba(222, 230, 250, .20)');
    halo.addColorStop(1, 'rgba(222, 230, 250, 0)');
    layerCtx.fillStyle = halo;
    layerCtx.fillRect(mx - mr * 5, my - mr * 5, mr * 10, mr * 10);

    const mc = document.createElement('canvas');
    mc.width = mc.height = Math.ceil(mr * 2 + 2);
    const mg = mc.getContext('2d');
    const cx2 = mr + 1, cy2 = mr + 1;
    const cg = mg.createRadialGradient(cx2 - mr * 0.25, cy2 - mr * 0.15, mr * 0.1, cx2, cy2, mr);
    cg.addColorStop(0, '#fdf6e3');
    cg.addColorStop(1, '#e6d5a4');
    mg.fillStyle = cg;
    mg.beginPath(); mg.arc(cx2, cy2, mr, 0, Math.PI * 2); mg.fill();
    mg.globalCompositeOperation = 'destination-out';
    mg.beginPath(); mg.arc(cx2 + mr * 0.44, cy2 - mr * 0.1, mr * 0.92, 0, Math.PI * 2); mg.fill();
    layerCtx.drawImage(mc, mx - cx2, my - cy2);
  }

  // -------------------- clouds --------------------
  function makeCloudSheet(w, h, tint, blobs) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    for (let i = 0; i < blobs; i++) {
      const x = Math.random() * w;
      const y = h * rand(0.25, 0.75);
      const rx = rand(h * 0.5, h * 1.3);
      const ry = rand(h * 0.14, h * 0.3);
      const a = rand(0.10, 0.22) * Math.min(1, Math.min(y, h - y) / (h * 0.22));
      const grad = g.createRadialGradient(x, y, 0, x, y, rx);
      grad.addColorStop(0, `rgba(${tint}, ${a.toFixed(3)})`);
      grad.addColorStop(1, `rgba(${tint}, 0)`);
      g.save();
      g.translate(x, y);
      g.scale(1, ry / rx);
      g.translate(-x, -y);
      g.fillStyle = grad;
      for (const ox of [-w, 0, w]) g.fillRect(x - rx + ox, y - rx, rx * 2, rx * 2);
      g.restore();
    }
    return c;
  }
  let cloudA, cloudAx = 0;

  // -------------------- window flames --------------------
  function drawWindows(time) {
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (const w of windows) {
      // occasional dark spell
      if (w.offT > 0) {
        w.offT -= 1 / 60;
        if (w.offT <= 0 && Math.random() < 0.4) w.offT = rand(0.5, 2.2);
      } else if (Math.random() < 0.0008) {
        w.offT = rand(1.5, 5);
      }
      const breathe = 0.5 + 0.5 * Math.sin(time * w.jy + w.ph);
      const jitter = fbm1(time * w.jx + w.ph * 3.1);
      const lit = w.offT > 0 ? 0.12 : 0.72 + 0.16 * breathe + 0.2 * (jitter - 0.5);
      ctx.fillStyle = `rgba(255, 186, 100, ${Math.max(0.06, lit).toFixed(3)})`;
      ctx.fillRect(w.x - w.w / 2, w.y - w.h / 2, w.w, w.h);
      stamp(glowFlame, w.x, w.y, w.w * 6.5, 0.30 * lit);
    }
    ctx.restore();
  }

  // -------------------- satellite --------------------
  const sat = { t: -1, next: rand(8, 20), y: 0, speed: 0 };
  function drawSatellite(time, dt) {
    if (sat.t < 0) {
      sat.next -= dt;
      if (sat.next <= 0) {
        sat.t = 0;
        sat.y = H * rand(0.08, 0.32);
        sat.speed = rand(28, 46) * (Math.random() < 0.5 ? -1 : 1);
      }
      return;
    }
    sat.t += dt;
    const x = sat.speed > 0 ? -20 + sat.t * sat.speed : W + 20 - sat.t * -sat.speed;
    const dur = (W + 40) / Math.abs(sat.speed);
    if (sat.t > dur) { sat.t = -1; sat.next = rand(55, 120); return; }
    const blink = 0.5 + 0.5 * Math.sin(time * 2.2);
    ctx.fillStyle = `rgba(235, 240, 255, ${0.5 + 0.4 * blink})`;
    ctx.fillRect(x, sat.y, 1.6 * U, 1.6 * U);
  }

  // -------------------- resize / build --------------------
  function resize() {
    DPR = Math.min(CONFIG.dprCap, window.devicePixelRatio || 1);
    W = Math.floor(window.innerWidth);
    H = Math.floor(window.innerHeight);
    U = W / 1600;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    paintSkyBg();
    paintCity();

    cloudA = makeCloudSheet(Math.ceil(W * 1.4), Math.ceil(H * 0.34), '120, 140, 190', 34);
    buildStars();
  }
  window.addEventListener('resize', resize, { passive: true });
  resize();

  // -------------------- loop --------------------
  let last = performance.now();
  let ready = false;

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const time = now / 1000;

    ctx.drawImage(bgLayer, 0, 0, W, H);

    // stars and haze turn behind the city
    drawStars(time);
    drawSatellite(time, dt);

    cloudAx -= CONFIG.cloudSpeed * dt;
    const wA = cloudA.width;
    let x = ((cloudAx % wA) + wA) % wA - wA;
    ctx.globalAlpha = 0.5;
    while (x < W) { ctx.drawImage(cloudA, x, H * 0.06); x += wA; }
    ctx.globalAlpha = 1;

    ctx.drawImage(cityLayer, 0, 0, W, H);
    drawWindows(time);

    if (!ready) { ready = true; document.body.classList.add('ready'); }
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
