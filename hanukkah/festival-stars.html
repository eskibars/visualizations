<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="color-scheme" content="dark"/>
  <title>Festival of Stars</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #040610; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .vignette {
      pointer-events: none; position: fixed; inset: 0;
      background: radial-gradient(ellipse 128% 104% at 50% 42%,
        rgba(0,0,0,0) 42%, rgba(0,0,0,.34) 82%, rgba(0,0,0,.78) 100%);
    }
    .caption {
      pointer-events: none; position: fixed; left: 0; right: 0; bottom: 3.4vh;
      text-align: center;
      font: 500 clamp(9px, .68vw, 13px)/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .34em; text-transform: uppercase;
      color: rgba(230, 220, 190, .27);
      text-shadow: 0 1px 14px rgba(0,0,0,.95);
      opacity: 0; transition: opacity 3s ease 2s;
    }
    body.ready .caption { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="vignette"></div>
  <div class="caption">light, gathered</div>
<script>
(() => {
  "use strict";

  // ============================================================
  //  FESTIVAL OF STARS — a quiet sky where, every little while,
  //  twelve stars leave the drift, take their places, and hold
  //  a Star of David in thin gold lines — a breath at the
  //  centre, a shimmer running the outline — before letting go
  //  and rejoining the field. Shooting stars come and go on
  //  their own schedule and pay it no attention.
  //
  //  Construction notes
  //  ------------------
  //  The field is two parallax layers of drifting, twinkling
  //  stars; twelve of them are the gatherers. A four-phase
  //  cycle (drift, gather, hold, dissolve) tweens those twelve
  //  between their field positions and the hexagram's outline
  //  points — six points of the two triangles, six inner
  //  corners — with the lines revealed and withdrawn as
  //  fractions of the same phase clock. Everything else is the
  //  shared glow sprite and one pooled meteor.
  // ============================================================
  const CONFIG = {
    dprCap: 1.6,

    stars: 250,
    drift: [3, 7],            // px/s per layer

    centre: { x: 0.5, y: 0.42 },
    R: 0.30,                  // hexagram radius, fraction of min(W,H)

    phases: { drift: [16, 26], gather: 7, hold: [11, 15], dissolve: 6 },

    meteorGap: [34, 85],
  };

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  let W = 0, H = 0, DPR = 1, U = 1;

  function rand(a, b) { return a + Math.random() * (b - a); }

  function noise1(x) {
    const i = Math.floor(x), f = x - i;
    const h = (n) => {
      const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
      return s - Math.floor(s);
    };
    const u = f * f * f * (f * (f * 6 - 15) + 10);
    return h(i) * (1 - u) + h(i + 1) * u;
  }
  const fbm1 = (x) => 0.6 * noise1(x) + 0.4 * noise1(x * 2.13 + 7.7);

  function makeGlow(r, g, b) {
    const s = 128, c = document.createElement('canvas');
    c.width = c.height = s;
    const g2 = c.getContext('2d');
    const grad = g2.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    grad.addColorStop(0, `rgba(${r},${g},${b},1)`);
    grad.addColorStop(0.25, `rgba(${r},${g},${b},.55)`);
    grad.addColorStop(0.6, `rgba(${r},${g},${b},.16)`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    g2.fillStyle = grad;
    g2.fillRect(0, 0, s, s);
    return c;
  }
  const glowStar = makeGlow(206, 220, 255);
  const glowGold = makeGlow(255, 226, 150);

  function stamp(sprite, x, y, size, alpha) {
    if (alpha <= 0.004) return;
    ctx.globalAlpha = Math.min(1, alpha);
    ctx.drawImage(sprite, x - size / 2, y - size / 2, size, size);
    ctx.globalAlpha = 1;
  }

  // -------------------- star field --------------------
  let field = [], gatherers = [];

  function buildField() {
    field = [];
    for (let i = 0; i < CONFIG.stars; i++) {
      const layer = i % 3 === 0 ? 1 : 0;
      field.push({
        bx: Math.random() * (W + 40) - 20,
        by: Math.random() * H * 0.9,
        layer,
        m: rand(0.25, 1),
        tw: rand(0.3, 1.6), ph: rand(0, Math.PI * 2),
        gatherer: false, slot: -1,
        gx: 0, gy: 0,        // gather tween origin
      });
    }
    // pick twelve well-separated gatherers
    gatherers = [];
    let guard = 0;
    while (gatherers.length < 12 && guard++ < 800) {
      const cand = field[(Math.random() * field.length) | 0];
      if (cand.gatherer) continue;
      const cx = W * CONFIG.centre.x, cy = H * CONFIG.centre.y;
      const R = Math.min(W, H) * CONFIG.R;
      const dx = cand.bx - cx, dy = cand.by - cy;
      if (Math.hypot(dx, dy) > R * 2.2) continue;
      cand.gatherer = true;
      cand.slot = gatherers.length;
      gatherers.push(cand);
    }
  }

  // hexagram outline: six outer points, six inner corners
  function slotPos(k) {
    const cx = W * CONFIG.centre.x, cy = H * CONFIG.centre.y;
    const R = Math.min(W, H) * CONFIG.R;
    const outer = k % 2 === 0;
    const ang = -Math.PI / 2 + Math.floor(k / 2) * (Math.PI / 3) + (outer ? 0 : Math.PI / 6);
    const r = outer ? R : R * 0.577;
    return { x: cx + Math.cos(ang) * r, y: cy + Math.sin(ang) * r };
  }

  // -------------------- phase machine --------------------
  const phase = { name: 'drift', t: 0, dur: 10 };
  function nextPhase() {
    const p = CONFIG.phases;
    if (phase.name === 'drift') { phase.name = 'gather'; phase.dur = p.gather; }
    else if (phase.name === 'gather') { phase.name = 'hold'; phase.dur = rand(...p.hold); }
    else if (phase.name === 'hold') { phase.name = 'dissolve'; phase.dur = p.dissolve; }
    else { phase.name = 'drift'; phase.dur = rand(...p.drift); }
    phase.t = 0;
  }

  function gathererPos(s, time) {
    const slot = slotPos(s.slot);
    if (phase.name === 'drift') return null;                     // just a field star
    if (phase.name === 'gather') {
      const k = Math.min(1, phase.t / phase.dur);
      const e = k * k * (3 - 2 * k);
      return { x: s.gx + (slot.x - s.gx) * e, y: s.gy + (slot.y - s.gy) * e, k };
    }
    if (phase.name === 'hold') {
      // lock on with a breath, and a shimmer travelling the outline
      const shim = Math.sin(time * 1.4 - s.slot * 0.55) * 1.6 * U;
      return { x: slot.x + shim * 0.4, y: slot.y + shim, k: 1 };
    }
    // dissolve: released back toward where the field has drifted to
    const k = Math.min(1, phase.t / phase.dur);
    const e = k * k;
    const fx = fieldX(s, time), fy = fieldY(s, time);
    return { x: slot.x + (fx - slot.x) * e, y: slot.y + (fy - slot.y) * e, k: 1 - k };
  }

  function fieldX(s, time) {
    const sp = CONFIG.drift[s.layer];
    return ((s.bx + time * sp * (s.layer ? 1.6 : 1)) % (W + 40) + (W + 40)) % (W + 40) - 20;
  }
  function fieldY(s, time) {
    return s.by + Math.sin(time * 0.05 + s.ph) * H * 0.006;
  }

  // -------------------- meteors --------------------
  const meteor = { t: -1, next: rand(6, 18), x: 0, y: 0, vx: 0, vy: 0, life: 0 };
  function drawMeteor(time, dt) {
    if (meteor.t < 0) {
      meteor.next -= dt;
      if (meteor.next <= 0 && phase.name !== 'hold') {
        meteor.t = 0;
        meteor.x = W * rand(0.15, 0.85);
        meteor.y = H * rand(0.05, 0.3);
        const ang = rand(2.4, 2.9);                    // down-left mostly
        const sp = W * rand(0.55, 0.85);
        meteor.vx = Math.cos(ang) * sp;
        meteor.vy = Math.sin(ang) * sp * 0.55;
        meteor.life = rand(0.7, 1.1);
      }
      return;
    }
    meteor.t += dt;
    if (meteor.t > meteor.life) { meteor.t = -1; meteor.next = rand(...CONFIG.meteorGap); return; }
    const x = meteor.x + meteor.vx * meteor.t;
    const y = meteor.y + meteor.vy * meteor.t;
    const k = meteor.t / meteor.life;
    const a = Math.sin(k * Math.PI);
    // trail
    const tx = meteor.vx * 0.09, ty = meteor.vy * 0.09;
    const grad = ctx.createLinearGradient(x, y, x - tx, y - ty);
    grad.addColorStop(0, `rgba(235, 240, 255, ${0.75 * a})`);
    grad.addColorStop(1, 'rgba(235, 240, 255, 0)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.6 * U;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - tx, y - ty);
    ctx.stroke();
    stamp(glowStar, x, y, 22 * U, 0.7 * a);
  }

  // -------------------- static: sky + ridge --------------------
  let bgLayer;
  function paintBg() {
    bgLayer = document.createElement('canvas');
    bgLayer.width = Math.floor(W * DPR); bgLayer.height = Math.floor(H * DPR);
    const g = bgLayer.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);

    const grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#040610');
    grad.addColorStop(0.55, '#070c1c');
    grad.addColorStop(0.85, '#0c1326');
    grad.addColorStop(1, '#101a30');
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);

    // a wisp of milky way, diagonal, very quiet
    const band = g.createLinearGradient(W * 0.1, H * 0.9, W * 0.9, H * 0.05);
    band.addColorStop(0, 'rgba(140, 160, 210, 0)');
    band.addColorStop(0.45, 'rgba(150, 168, 214, .045)');
    band.addColorStop(0.6, 'rgba(160, 175, 220, .06)');
    band.addColorStop(1, 'rgba(150, 168, 214, 0)');
    g.fillStyle = band;
    g.fillRect(0, 0, W, H);

    // low ridge along the bottom
    g.fillStyle = '#060a14';
    g.beginPath();
    g.moveTo(-2, H + 2);
    for (let x = -2; x <= W + 2; x += 9) {
      const t = x / W;
      g.lineTo(x, H * 0.945 + Math.sin(t * 5.2 + 1.1) * H * 0.012 + noise1(t * 3.7 + 5) * H * 0.008);
    }
    g.lineTo(W + 2, H + 2);
    g.closePath();
    g.fill();
    // one cypress, small, at the right
    const bx = W * 0.905, by = H * 0.952, hh = H * 0.055;
    g.beginPath();
    g.moveTo(bx - hh * 0.11, by);
    g.quadraticCurveTo(bx - hh * 0.13, by - hh * 0.55, bx, by - hh);
    g.quadraticCurveTo(bx + hh * 0.13, by - hh * 0.55, bx + hh * 0.11, by);
    g.closePath();
    g.fill();
  }

  // -------------------- draw --------------------
  function draw(time, dt) {
    // field stars
    for (const s of field) {
      if (s.gatherer && phase.name !== 'drift') continue;   // drawn below
      const x = fieldX(s, time), y = fieldY(s, time);
      const tw = 0.5 + 0.5 * Math.sin(time * s.tw * Math.PI * 2 + s.ph);
      const a = (0.2 + 0.55 * s.m) * (0.45 + 0.55 * tw);
      if (s.m > 0.8) stamp(glowStar, x, y, 12 * U * s.m, a * 0.5);
      ctx.fillStyle = `rgba(214, 224, 252, ${a.toFixed(3)})`;
      const sz = s.m > 0.85 ? 1.8 * U : 1.2 * U;
      ctx.fillRect(x, y, sz, sz);
    }

    // the twelve
    const linesOn = phase.name === 'hold' ? 1
      : phase.name === 'gather' ? Math.max(0, (phase.t / phase.dur - 0.55) / 0.45)
      : phase.name === 'dissolve' ? 1 - phase.t / phase.dur : 0;

    // record current gatherer positions for the connecting lines
    const pts = [];
    for (const s of gatherers) {
      const p = gathererPos(s, time);
      if (!p) continue;                        // drifting: drawn as a field star
      const x = p.x, y = p.y;
      pts.push({ x, y });
      // brightness: field dim -> locked bright gold-tinged
      const lock = phase.name === 'hold' ? 1 : (phase.name === 'gather' ? p.k : 1 - (phase.t / phase.dur) * 0.9);
      const shim = phase.name === 'hold'
        ? 0.75 + 0.25 * Math.sin(time * 1.4 - s.slot * 0.55)
        : 0.9;
      const a = 0.35 + 0.65 * lock;
      stamp(glowStar, x, y, 26 * U, 0.55 * a * shim);
      if (lock > 0.5) stamp(glowGold, x, y, 15 * U, (lock - 0.5) * 1.2 * shim);
      ctx.fillStyle = `rgba(238, 240, 255, ${(0.5 + 0.5 * lock).toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(x, y, (1.3 + 1.1 * lock) * U, 0, Math.PI * 2);
      ctx.fill();
    }

    // the connecting lines, drawn as two triangles revealed in turn
    if (linesOn > 0.003) {
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      const tri = (idx, reveal) => {
        if (reveal <= 0.003) return;
        ctx.beginPath();
        for (let n = 0; n < 3; n++) {
          const p = pts[idx[n]];
          if (n === 0) ctx.moveTo(p.x, p.y);
          else {
            const q = pts[idx[n - 1]];
            const tt = Math.min(1, Math.max(0, reveal));
            ctx.lineTo(q.x + (p.x - q.x) * tt, q.y + (p.y - q.y) * tt);
          }
        }
        ctx.closePath();
        const shimmer = 0.75 + 0.25 * fbm1(time * 0.9 + idx[0]);
        ctx.strokeStyle = `rgba(240, 206, 128, ${(0.34 * shimmer * Math.min(1, linesOn * 1.4)).toFixed(3)})`;
        ctx.lineWidth = 1.2 * U;
        ctx.stroke();
      };
      // triangle vertices: slots 0,4,8 (up) and 2,6,10 (down)
      tri([0, 4, 8], linesOn);
      tri([2, 6, 10], Math.max(0, linesOn - 0.25) / 0.75);

      // centre breath
      if (phase.name === 'hold') {
        const breath = 0.5 + 0.5 * Math.sin(time * 0.7);
        const cx = W * CONFIG.centre.x, cy = H * CONFIG.centre.y;
        stamp(glowGold, cx, cy, Math.min(W, H) * (0.22 + 0.04 * breath), 0.10 + 0.05 * breath);
      }
      ctx.restore();
    }

    // capture tween origins when gather begins
    if (phase.name === 'gather' && phase.t < dt * 1.5) {
      for (const s of gatherers) { s.gx = fieldX(s, time); s.gy = fieldY(s, time); }
    }
  }

  // -------------------- resize / build --------------------
  function resize() {
    DPR = Math.min(CONFIG.dprCap, window.devicePixelRatio || 1);
    W = Math.floor(window.innerWidth);
    H = Math.floor(window.innerHeight);
    U = W / 1600;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    paintBg();
    buildField();
  }
  window.addEventListener('resize', resize, { passive: true });
  resize();

  // -------------------- loop --------------------
  let last = performance.now();
  let ready = false;

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const time = now / 1000;

    ctx.drawImage(bgLayer, 0, 0, W, H);

    phase.t += dt;
    if (phase.t >= phase.dur) nextPhase();

    draw(time, dt);
    drawMeteor(time, dt);

    if (!ready) { ready = true; document.body.classList.add('ready'); }
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
