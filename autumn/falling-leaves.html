<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="color-scheme" content="dark"/>
  <title>Falling Leaves</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #241a10; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .vignette {
      pointer-events: none; position: fixed; inset: 0;
      background: radial-gradient(ellipse 130% 105% at 50% 40%,
        rgba(0,0,0,0) 42%, rgba(0,0,0,.30) 82%, rgba(0,0,0,.68) 100%);
    }
    .caption {
      pointer-events: none; position: fixed; left: 0; right: 0; bottom: 3.4vh;
      text-align: center;
      font: 500 clamp(9px, .68vw, 13px)/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .34em; text-transform: uppercase;
      color: rgba(255, 214, 150, .30);
      text-shadow: 0 1px 14px rgba(0,0,0,.95);
      opacity: 0; transition: opacity 3s ease 2s;
    }
    body.ready .caption { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="vignette"></div>
  <div class="caption">october · gold fall</div>
<script>
(() => {
  "use strict";

  // ============================================================
  //  FALLING LEAVES — a stream through October. Maple leaves let
  //  go in gusts, spiral down through the light, and where they
  //  land they float off downstream in rings. Mist slides between
  //  the gold trees; the sun never quite climbs over the ridge.
  // ============================================================
  const CONFIG = {
    dprCap: 1.6,

    waterY: 0.76,           // the stream's far edge: the horizon the trees stand behind
    leavesAir: 140,          // leaves airborne at once
    gustEvery: [5, 11],      // s — wind gust releases a batch

    treeGold: ['#c9541e', '#d97b2a', '#e0a13c', '#b8401f', '#e8c04a', '#a63a1a'],
    leafGold: ['#d97b2a', '#e0a13c', '#c9541e', '#e8c04a', '#b8401f'],
  };

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  let W = 0, H = 0, DPR = 1, S = 1;
  let waterY = 0;
  // Pre-rendered tree layers are rasterised at this resolution and scaled down
  // when blitted. Above 1x the thin trunks gain nothing measurable but each
  // layer costs more to downscale every frame, which is the whole frame budget
  // on a software rasteriser, so these stay at 1.
  const RES = { far: 1, mid: 1, near: 1 };

  function rand(a, b) { return a + Math.random() * (b - a); }
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];

  // -------------------- leaf sprites --------------------
  const LEAF = 6;
  let leafSprites = [];

  function makeLeafSprite(color) {
    const s = 26;
    const c = document.createElement('canvas');
    c.width = c.height = s;
    const g = c.getContext('2d');
    g.translate(s / 2, s / 2);
    // maple-ish: five lobes
    g.fillStyle = color;
    g.beginPath();
    const R = s * 0.42;
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + (i / 5) * Math.PI * 2;
      const mid = a + Math.PI / 5;
      g.quadraticCurveTo(
        Math.cos(a - 0.28) * R * 0.55, Math.sin(a - 0.28) * R * 0.55,
        Math.cos(a) * R, Math.sin(a) * R);
      g.quadraticCurveTo(
        Math.cos(mid + 0.16) * R * 0.5, Math.sin(mid + 0.16) * R * 0.5,
        Math.cos(mid) * R * 0.18, Math.sin(mid) * R * 0.18);
    }
    g.closePath();
    g.fill();
    // stem
    g.strokeStyle = 'rgba(70, 40, 15, 0.8)';
    g.lineWidth = 1.2;
    g.beginPath();
    g.moveTo(0, R * 0.1);
    g.lineTo(0, R * 0.95);
    g.stroke();
    return c;
  }

  function buildLeafSprites() {
    leafSprites = CONFIG.leafGold.map(makeLeafSprite);
  }

  // -------------------- trees --------------------
  // "Lollipop" trees read as a beach umbrella with a ball balanced beside it:
  // thin black strokes that stop in mid-air, and a cluster of glossy spheres
  // hanging off to one side. So the trunk is a real tapering shape whose top
  // curve continues into a *recursive* skeleton, every twig end carries a few
  // small foliage clumps (the canopy is what the skeleton grew, not a
  // free-floating pile), the trunk leans the way its canopy leans so the mass
  // balances over the base, and the skeleton is drawn before the leaves it
  // holds. Trees are built back-to-front into one canvas per depth band, so a
  // nearer band covers a farther one instead of overlapping tree by tree.

  const TREE_DEPTH = 5;
  const DISTANT_GOLD = ['#9d4e1a', '#b06427', '#843f14'];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function shade(hex, k) {
    const n = parseInt(hex.slice(1), 16);
    const f = (v) => Math.max(0, Math.min(255, Math.round(v * k)));
    return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
  }

  // A few clumps of leaves at the end of one twig. Small and overlapping:
  // foliage should be the sum of many clumps, never one sphere sitting on a
  // stick like a ball on a plinth.
  function leafCluster(g, x, y, r, distant) {
    const n = 3 + ((Math.random() * 3) | 0);
    for (let i = 0; i < n; i++) {
      const cx = x + rand(-r * 0.7, r * 0.7);
      const cy = y + rand(-r * 0.6, r * 0.5);
      const cr = r * rand(0.45, 0.80);
      const col = distant ? pick(DISTANT_GOLD) : pick(CONFIG.treeGold);
      const grad = g.createRadialGradient(cx - cr * 0.3, cy - cr * 0.34, cr * 0.08, cx, cy, cr);
      if (distant) {
        grad.addColorStop(0, shade(col, 1.04));
        grad.addColorStop(1, shade(col, 0.72));
      } else {
        grad.addColorStop(0, shade(col, 1.10));
        grad.addColorStop(0.55, col);
        grad.addColorStop(1, shade(col, 0.70));
      }
      g.fillStyle = grad;
      g.beginPath();
      g.arc(cx, cy, cr, 0, Math.PI * 2);
      g.fill();
    }
  }

  // One limb: it rises, then forks. Limbs near the trunk climb steeply and the
  // outer twigs flatten out and spread sideways, which is what gives the
  // canopy a wide top instead of a vertical column of blobs.
  function branch(g, x, y, dir, len, w, color, depth, distant, maxClump) {
    const rise = 0.16 + 0.07 * depth;
    const tipX = x + dir * len;
    const tipY = y - len * rise;

    g.beginPath();
    g.moveTo(x, y);
    g.quadraticCurveTo(x + dir * len * 0.4, y - len * rise * 0.5, tipX, tipY);
    g.lineWidth = w;
    g.lineCap = 'round';
    g.strokeStyle = color;
    g.stroke();

    if (depth <= 0) {
      leafCluster(g, tipX, tipY, Math.min(len, maxClump), distant);
      return;
    }

    const kids = depth >= 3 && Math.random() < 0.6 ? 3 : 2;
    for (let i = 0; i < kids; i++) {
      // the leading shoot keeps going; the others fork off to either side
      const spread = i === 0 ? rand(0.85, 1.15) : rand(0.75, 1.30) * (Math.random() < 0.5 ? 1 : -1);
      const next = clamp(dir * spread, -2.4, 2.4);
      branch(g, tipX, tipY, next, len * rand(0.70, 0.86), w * 0.62, color, depth - 1, distant, maxClump);
    }
  }

  function drawTrunk(g, x0, y0, len, w0, lean, color, distant, depth) {
    // Foliage clumps are capped in size. Left uncapped they grow with the tree,
    // and a big tree stops looking like a canopy and starts looking like a
    // bunch of balloons. Too small and the skeleton shows through as bare
    // diagonals, so this wants to stay in the range where clumps just touch.
    const maxClump = len * 0.2;
    const x1 = x0 + lean * len * 3;
    const y1 = y0 - len;
    g.beginPath();
    g.moveTo(x0 - w0 / 2, y0);
    g.quadraticCurveTo(x0 - w0 * 0.26, y0 - len * 0.56, x1 - w0 * 0.15, y1);
    g.lineTo(x1 + w0 * 0.15, y1);
    g.quadraticCurveTo(x0 + w0 * 0.26, y0 - len * 0.56, x0 + w0 / 2, y0);
    g.closePath();
    g.fillStyle = color;
    g.fill();

    // a flare where the trunk meets the ground, so it is planted rather than cut
    g.beginPath();
    g.moveTo(x0 - w0 * 1.35, y0 + w0 * 0.1);
    g.quadraticCurveTo(x0 - w0 * 0.55, y0 - w0 * 0.6, x0 + w0 * 0.55, y0 - w0 * 0.6);
    g.quadraticCurveTo(x0 + w0 * 0.7, y0 - w0 * 0.55, x0 + w0 * 1.35, y0 + w0 * 0.1);
    g.closePath();
    g.fill();

    // one or two leaders continue the trunk; the crown spreads from there
    branch(g, x1, y1, lean * 0.6 + rand(-0.25, 0.25), len * rand(0.52, 0.68), w0 * 0.6, color, depth, distant, maxClump);
    if (Math.random() < 0.55) {
      branch(g, x1, y1 - len * rand(0.05, 0.2), rand(-1.15, -0.35), len * rand(0.36, 0.52), w0 * 0.42, color, depth - 1, distant, maxClump);
    }

    // A tall bare pole with a pillow of leaves on top still reads as a lollipop.
    // Carry a couple of limbs out of the upper trunk as well, so the crown
    // starts lower down and the trunk disappears into foliage.
    for (let k = 0; k < 2; k++) {
      const at = rand(0.52, 0.88);
      const side = Math.random() < 0.5 ? 1 : -1;
      branch(g, x0 + lean * len * 3 * at, y0 - len * at,
        side * rand(0.55, 1.25), len * rand(0.30, 0.46), w0 * 0.40, color, depth - 2, distant, maxClump);
    }
  }

  function drawTree(g, x, yBase, height, color, distant) {
    const head = rand(-0.3, 0.3);          // which way this tree leans
    const tw = height * rand(0.030, 0.040);
    drawTrunk(g, x, yBase, height * 0.30, tw, head * 0.16, color, distant, TREE_DEPTH);
  }

  function makeTreeLayer(count, yBase, scale, distant, bands, res) {
    const LR = res;
    const c = document.createElement('canvas');
    c.cssH = Math.ceil(yBase + 8);
    c.width = Math.ceil(W * LR);
    c.height = Math.ceil(c.cssH * LR);
    const g = c.getContext('2d');
    g.setTransform(LR, 0, 0, LR, 0, 0);
    const color = distant ? '#2c1709' : '#3a2210';

    // Shuffle the back-to-front slots first, so planting order does not follow
    // the draw order (which would put the far half of every clump behind the
    // near half). Nearer trees stand a little lower on the bank and are drawn
    // last, so their trunks pass in front of the canopies behind them.
    const slots = [];
    for (let i = 0; i < count; i++) {
      const depth = (i + Math.random()) / count;
      const band = bands ? bands[i % bands.length] : [-0.03, 1.03];
      slots.push({
        depth,
        x: rand(band[0], band[1]) * W,
        height: rand(0.30, 0.58) * scale * H * (0.85 + 0.3 * depth),
        dark: distant || Math.random() < 0.35,
      });
    }
    slots.sort((a, b) => a.depth - b.depth);

    for (const t of slots) {
      const y = yBase - Math.pow(t.depth, 1.6) * scale * H * 0.03;
      drawTree(g, t.x, y, t.height, t.dark ? '#2c1709' : color, t.dark);
    }
    return c;
  }

  let farTrees, midTrees, nearTrees;

  // Pre-rendered layers are wider than the viewport in pixels, so they must
  // always be blitted at their CSS size, never at their intrinsic pixel size.
  function drawLayer(img) {
    ctx.drawImage(img, 0, 0, W, img.cssH);
  }

  function buildTrees() {
    // Every tree stands on the far bank, just above the stream: the waterline is
    // the horizon, and the water (drawn after the trees) covers the last few
    // pixels of each trunk so the roots sit behind it instead of hovering over
    // the surface. Depth comes from scale, from how dark the foliage is, and
    // from drawing order: far band first, the big near trees last.
    farTrees = makeTreeLayer(16, waterY - 3, 0.34, true, null, RES.far);
    midTrees = makeTreeLayer(8, waterY - 1, 0.62, false, null, RES.mid);
    nearTrees = makeTreeLayer(2, waterY + 3, 1.10, false, [[0.02, 0.26], [0.74, 0.98]], RES.near);
  }

  // -------------------- leaves --------------------
  const airLeaves = [];   // falling
  const floatLeaves = []; // on the water
  let gustT = 3;

  function spawnAirLeaf(batch) {
    airLeaves.push({
      x: rand(-0.05, 1.05) * W,
      y: batch === 'gust' ? rand(0.05, 0.55) * H : rand(-0.25, 0.05) * H,
      vy: rand(18, 44) * S,
      swayA: rand(14, 42) * S,
      swayW: rand(0.8, 2.2),
      ph: rand(0, Math.PI * 2),
      rot: rand(0, Math.PI * 2),
      vr: rand(-2.4, 2.4),
      size: rand(0.7, 1.5) * 22 * S,
      spr: (Math.random() * leafSprites.length) | 0,
      flutter: rand(2.5, 6),
    });
  }

  function updateLeaves(dt, time, wind) {
    for (let i = airLeaves.length - 1; i >= 0; i--) {
      const l = airLeaves[i];
      l.y += l.vy * dt * (0.75 + 0.5 * Math.abs(Math.sin(time * l.flutter + l.ph)));
      l.x += (Math.sin(time * l.swayW + l.ph) * l.swayA * 0.55 + wind * (30 + l.size)) * dt;
      l.rot += (l.vr + wind * 0.55) * dt;
      if (l.y >= waterY - 4) {
        airLeaves.splice(i, 1);
        if (Math.random() < 0.75) {
          floatLeaves.push({
            x: l.x, y: waterY + rand(2, H * 0.20),
            spr: l.spr, size: l.size,
            rot: l.rot,
            drift: rand(9, 26) * S,
            ph: rand(0, Math.PI * 2),
            fade: 1,
          });
          addRipple(l.x, waterY + 4, 0.5);
        }
        continue;
      }
      if (l.x > W + 60) { l.x = -50; }
      if (l.x < -80) { l.x = W + 40; }
    }

    for (let i = floatLeaves.length - 1; i >= 0; i--) {
      const f = floatLeaves[i];
      f.x -= f.drift * dt * (0.8 + 0.3 * Math.sin(time * 0.7 + f.ph));
      f.y += Math.sin(time * 0.9 + f.ph) * 3 * S * dt;
      f.rot += 0.25 * dt;
      if (f.x < -40) f.x = W + 30;
    }
  }

  // -------------------- ripples on the stream --------------------
  const ripples = [];

  function addRipple(x, y, strength) {
    ripples.push({ x, y, r: 2, v: 40 * S, a: 0.35 * strength });
    if (ripples.length > 26) ripples.shift();
  }

  // -------------------- mist --------------------
  let mistBlobs = [];

  function buildMist() {
    mistBlobs = [];
    for (let i = 0; i < 7; i++) {
      mistBlobs.push({
        x: Math.random(), y: rand(0.46, 0.80),
        r: rand(0.08, 0.15),
        a: rand(0.04, 0.08),
        drift: rand(0.004, 0.014) * (Math.random() < 0.5 ? 1 : -1),
        ph: rand(0, Math.PI * 2),
      });
    }
  }

  // -------------------- draw --------------------
  function drawSky(time) {
    const g = ctx.createLinearGradient(0, 0, 0, waterY);
    g.addColorStop(0, '#4a2c14');
    g.addColorStop(0.45, '#8a5222');
    g.addColorStop(0.75, '#c98a3a');
    g.addColorStop(1, '#e8b45e');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, waterY);

    // low sun glow behind the far trees
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, waterY);
    ctx.clip();
    ctx.globalCompositeOperation = 'screen';
    const sx = W * 0.72, sy = waterY;
    const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, W * 0.35);
    const a = 0.20 + 0.03 * Math.sin(time * 0.2);
    sg.addColorStop(0, `rgba(255, 220, 140, ${a})`);
    sg.addColorStop(1, 'rgba(255, 200, 120, 0)');
    ctx.fillStyle = sg;
    ctx.fillRect(sx - W * 0.35, sy - W * 0.35, W * 0.7, W * 0.7);
    ctx.restore();
  }

  // The far bank the trees stand on, as a soft shadowed strip right at the
  // waterline. Without it the trunks would end in a line of hard cut-offs
  // against the sky; with it they stand on land that the water then laps.
  function drawFarBank() {
    const h = H * 0.018;
    const g = ctx.createLinearGradient(0, waterY - h, 0, waterY);
    g.addColorStop(0, 'rgba(48,28,10,0)');
    g.addColorStop(0.55, 'rgba(42,24,8,0.55)');
    g.addColorStop(1, 'rgba(30,17,5,0.9)');
    ctx.fillStyle = g;
    ctx.fillRect(0, waterY - h, W, h);
  }

  function drawTrees() {
    drawLayer(farTrees);
    drawFarBank();
  }

  function drawMidTrees() {
    drawLayer(midTrees);
  }
  function drawStream(time) {
    const wy = waterY;
    const h = H - wy;
    const g = ctx.createLinearGradient(0, wy, 0, H);
    g.addColorStop(0, '#8a5a24');
    g.addColorStop(0.25, '#5c3b1a');
    g.addColorStop(1, '#2b1c0c');
    ctx.fillStyle = g;
    ctx.fillRect(0, wy, W, h);

    // mirrored mid trees, faint and half-swallowed by the near edge
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, wy, W, h);
    ctx.clip();
    ctx.globalAlpha = 0.15;
    ctx.translate(0, waterY * 2);
    ctx.scale(1, -1);
    drawLayer(midTrees);
    ctx.restore();

    // a dark scrim at the waterline, so the reflection starts in shadow the way
    // a real one does and the join does not read as a hard cut
    ctx.save();
    const sgTop = ctx.createLinearGradient(0, wy, 0, wy + h * 0.34);
    sgTop.addColorStop(0, 'rgba(28,16,5,0.55)');
    sgTop.addColorStop(1, 'rgba(28,16,5,0)');
    ctx.fillStyle = sgTop;
    ctx.fillRect(0, wy, W, h * 0.34);
    ctx.restore();

    // sun streak on the water
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    const sg = ctx.createLinearGradient(W * 0.55, 0, W * 0.9, 0);
    sg.addColorStop(0, 'rgba(255, 190, 100, 0)');
    sg.addColorStop(0.5, `rgba(255, 190, 100, ${0.18 + 0.04 * Math.sin(time * 0.3)})`);
    sg.addColorStop(1, 'rgba(255, 190, 100, 0)');
    ctx.fillStyle = sg;
    ctx.fillRect(0, wy, W, h * 0.6);
    ctx.restore();

    // drifting ripple lines
    ctx.save();
    ctx.strokeStyle = 'rgba(232, 180, 94, 0.16)';
    ctx.lineWidth = 1.2 * S;
    for (let i = 0; i < 7; i++) {
      const y = wy + h * (0.12 + i * 0.13);
      const off = ((time * (14 + i * 5) * S) % (W + 200)) - 100;
      ctx.beginPath();
      for (let x = -20; x < W + 20; x += 26) {
        const yy = y + Math.sin(x * 0.02 + time * 0.8 + i) * 2.4 * S;
        if (x === -20) ctx.moveTo(x + off - W * 0.1, yy);
        else ctx.lineTo(x + off - W * 0.1, yy);
      }
      ctx.stroke();
    }
    ctx.restore();

    // expanding ripples
    ctx.save();
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.r += r.v * dtG;
      r.a -= 0.25 * dtG;
      if (r.a <= 0.01) { ripples.splice(i, 1); continue; }
      ctx.strokeStyle = `rgba(240, 200, 120, ${r.a})`;
      ctx.lineWidth = 1.4 * S;
      ctx.beginPath();
      ctx.ellipse(r.x, r.y, r.r, r.r * 0.3, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawMist(time, dt) {
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (const m of mistBlobs) {
      m.x += m.drift * dt;
      if (m.x > 1.2) m.x = -0.2;
      if (m.x < -0.2) m.x = 1.2;
      const x = m.x * W + Math.sin(time * 0.3 + m.ph) * 10 * S;
      const y = m.y * H;
      const r = m.r * W;
      const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
      grad.addColorStop(0, `rgba(240, 205, 150, ${m.a})`);
      grad.addColorStop(1, 'rgba(240, 205, 150, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    ctx.restore();
  }

  function drawAirLeaves(time) {
    for (const l of airLeaves) {
      const sway = Math.sin(time * l.swayW + l.ph) * l.swayA * 0.5;
      ctx.save();
      ctx.translate(l.x + sway, l.y);
      ctx.rotate(l.rot);
      const flip = Math.sin(time * l.flutter + l.ph);
      ctx.scale(1, 0.35 + 0.65 * Math.abs(flip));   // leaf turning in the air
      ctx.drawImage(leafSprites[l.spr], -l.size / 2, -l.size / 2, l.size, l.size);
      ctx.restore();
    }
  }

  function drawFloatLeaves(time) {
    for (const f of floatLeaves) {
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rot);
      ctx.scale(1, 0.5);
      ctx.globalAlpha = 0.92;
      ctx.drawImage(leafSprites[f.spr], -f.size / 2, -f.size / 2, f.size, f.size);
      ctx.restore();
    }
  }

  function drawNearTrees() {
    drawLayer(nearTrees);
  }

  // -------------------- resize --------------------
  function resize() {
    DPR = Math.min(CONFIG.dprCap, window.devicePixelRatio || 1);
    W = Math.floor(window.innerWidth);
    H = Math.floor(window.innerHeight);
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S = W / 1600;
    waterY = H * CONFIG.waterY;
    buildLeafSprites();
    buildTrees();
    buildMist();
  }
  window.addEventListener('resize', resize, { passive: true });
  resize();

  // pre-fill: some leaves already falling, some floating
  for (let i = 0; i < CONFIG.leavesAir; i++) spawnAirLeaf('gust');
  for (let i = 0; i < 26; i++) {
    const l = airLeaves[i];
    floatLeaves.push({
      x: rand(0, W), y: waterY + rand(2, H * 0.20),
      spr: (Math.random() * leafSprites.length) | 0,
      size: rand(0.7, 1.5) * 22 * S,
      rot: rand(0, Math.PI * 2),
      drift: rand(9, 26) * S,
      ph: rand(0, Math.PI * 2),
      fade: 1,
    });
  }

  // -------------------- loop --------------------
  let last = performance.now();
  let ready = false;
  let dtG = 1 / 60;
  let wind = 0;

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const time = now / 1000;
    dtG = dt;

    // wind: slow breathing + gusts that shed leaves
    gustT -= dt;
    let gust = 0;
    if (gustT <= 0) {
      gustT = rand(CONFIG.gustEvery[0], CONFIG.gustEvery[1]);
      gust = rand(0.8, 2.2) * (Math.random() < 0.5 ? 1 : 1); // always downstream-ish
      const n = 6 + (Math.random() * 8) | 0;
      for (let i = 0; i < n; i++) spawnAirLeaf('gust');
    }
    wind = Math.sin(time * 0.4) * 0.6 + gust;

    while (airLeaves.length < CONFIG.leavesAir) spawnAirLeaf('top');

    updateLeaves(dt, time, wind);

    drawSky(time);
    drawTrees();
    drawMist(time, dt);
    drawMidTrees();
    drawStream(time);
    drawMist(time, dt);
    drawFloatLeaves(time);
    drawAirLeaves(time);
    drawNearTrees();

    if (!ready) { ready = true; document.body.classList.add('ready'); }
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
