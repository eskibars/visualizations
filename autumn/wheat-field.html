<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="color-scheme" content="dark"/>
  <title>Wheat Field</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #3a2a18; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .vignette {
      pointer-events: none; position: fixed; inset: 0;
      background: radial-gradient(ellipse 128% 102% at 42% 48%,
        rgba(0,0,0,0) 42%, rgba(0,0,0,.30) 82%, rgba(0,0,0,.72) 100%);
    }
    .caption {
      pointer-events: none; position: fixed; left: 0; right: 0; bottom: 3.4vh;
      text-align: center;
      font: 500 clamp(9px, .68vw, 13px)/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .34em; text-transform: uppercase;
      color: rgba(255, 226, 170, .28);
      text-shadow: 0 1px 14px rgba(0,0,0,.95);
      opacity: 0; transition: opacity 3s ease 2s;
    }
    body.ready .caption { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="vignette"></div>
  <div class="caption">the wind does the threshing</div>
<script>
(() => {
  "use strict";

  // ============================================================
  //  WHEAT FIELD — the last hour before harvest. Four hundred
  //  stalks in four depth bands bow and spring as gusts roll
  //  down the field from the west; the sun sits low between the
  //  rows and everything the light touches goes to gold. Every
  //  so often the gust tears a leaf loose and carries it
  //  through.
  //
  //  Construction notes
  //  ------------------
  //  A stalk is one quadratic stroke whose control point leans
  //  with the wind, so a frame is ~400 cheap strokes plus the
  //  sky blit — no per-stalk state. The wind is two travelling
  //  sine waves over space with value-noise gusts on top, and
  //  every stalk owns a phase offset and a stiffness, so the
  //  field waves instead of marching. Depth is four pre-sorted
  //  bands: farther bands are shorter, hazier and drawn before
  //  the sun's disc, nearer bands after it.
  // ============================================================
  const CONFIG = {
    dprCap: 1.6,

    sun: { x: 0.37, y: 0.565 },

    bands: [
      { base: 0.700, h: [0.045, 0.060], n: 78,  col: '#a8823e', head: 'rgba(240, 205, 120, .5)',   hazy: 0.45, ground: '#c39244' },
      { base: 0.775, h: [0.060, 0.082], n: 88,  col: '#8f6a30', head: 'rgba(234, 192, 104, .62)',  hazy: 0.28, ground: '#9d7132' },
      { base: 0.862, h: [0.082, 0.112], n: 98,  col: '#6f4e22', head: 'rgba(228, 184, 96, .75)',   hazy: 0.12, ground: '#6b4820' },
      { base: 0.965, h: [0.115, 0.150], n: 105, col: '#3f2c14', head: 'rgba(226, 180, 92, .85)',   hazy: 0.0,  ground: '#33220e' },
    ],

    leaves: 6,
  };

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  let W = 0, H = 0, DPR = 1, U = 1;

  function rand(a, b) { return a + Math.random() * (b - a); }

  function noise1(x) {
    const i = Math.floor(x), f = x - i;
    const h = (n) => {
      const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
      return s - Math.floor(s);
    };
    const u = f * f * f * (f * (f * 6 - 15) + 10);
    return h(i) * (1 - u) + h(i + 1) * u;
  }
  const fbm1 = (x) => 0.6 * noise1(x) + 0.4 * noise1(x * 2.13 + 7.7);

  // -------------------- sky (static) --------------------
  let skyLayer;
  function paintSky() {
    skyLayer = document.createElement('canvas');
    skyLayer.width = Math.floor(W * DPR); skyLayer.height = Math.floor(H * DPR);
    const g = skyLayer.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);

    const grad = g.createLinearGradient(0, 0, 0, H * 0.75);
    grad.addColorStop(0, '#4a3a30');
    grad.addColorStop(0.42, '#7d5632');
    grad.addColorStop(0.72, '#b87f3c');
    grad.addColorStop(0.92, '#e0a950');
    grad.addColorStop(1, '#eec162');
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);

    // thin horsetail clouds, backlit: bright underneath
    for (let i = 0; i < 7; i++) {
      const y = H * rand(0.08, 0.42);
      const x = Math.random() * W;
      const len = W * rand(0.14, 0.4);
      const hh = H * rand(0.006, 0.016);
      const cg = g.createLinearGradient(x, y, x + len, y);
      cg.addColorStop(0, 'rgba(120, 78, 52, 0)');
      cg.addColorStop(0.5, `rgba(110, 74, 50, ${rand(0.06, 0.13).toFixed(2)})`);
      cg.addColorStop(1, 'rgba(120, 78, 52, 0)');
      g.fillStyle = cg;
      g.beginPath();
      g.ellipse(x + len / 2, y, len / 2, hh, rand(-0.05, 0.05), 0, Math.PI * 2);
      g.fill();
      g.fillStyle = `rgba(255, 214, 140, ${rand(0.04, 0.08).toFixed(2)})`;
      g.beginPath();
      g.ellipse(x + len / 2, y + hh * 0.4, len * 0.38, hh * 0.3, 0, 0, Math.PI * 2);
      g.fill();
    }

    // the sun: huge low glow, the disc itself sits behind the stalks
    const sx = W * CONFIG.sun.x, sy = H * CONFIG.sun.y;
    const glow = g.createRadialGradient(sx, sy, 0, sx, sy, W * 0.42);
    glow.addColorStop(0, 'rgba(255, 236, 180, .55)');
    glow.addColorStop(0.25, 'rgba(255, 208, 120, .28)');
    glow.addColorStop(0.6, 'rgba(240, 170, 90, .10)');
    glow.addColorStop(1, 'rgba(240, 170, 90, 0)');
    g.fillStyle = glow;
    g.fillRect(0, 0, W, H);

    // horizontal flare band across the horizon
    const flare = g.createLinearGradient(0, sy - H * 0.02, 0, sy + H * 0.03);
    flare.addColorStop(0, 'rgba(255, 226, 150, 0)');
    flare.addColorStop(0.5, 'rgba(255, 226, 150, .18)');
    flare.addColorStop(1, 'rgba(255, 226, 150, 0)');
    g.fillStyle = flare;
    g.fillRect(0, sy - H * 0.02, W, H * 0.05);
  }

  // sun disc, drawn between the stalk bands
  function drawSunDisc() {
    const sx = W * CONFIG.sun.x, sy = H * CONFIG.sun.y, sr = H * 0.075;
    const disc = ctx.createRadialGradient(sx - sr * 0.15, sy - sr * 0.2, sr * 0.1, sx, sy, sr);
    disc.addColorStop(0, '#fff6d8');
    disc.addColorStop(0.62, '#ffe9ae');
    disc.addColorStop(0.88, 'rgba(255, 224, 150, .85)');
    disc.addColorStop(1, 'rgba(255, 224, 150, 0)');
    ctx.fillStyle = disc;
    ctx.beginPath();
    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx.fill();
  }

  // -------------------- stalks --------------------
  // stalks[x] per band: fixed geometry, wind does the rest
  const bandStalks = [];
  function buildStalks() {
    bandStalks.length = 0;
    let bi = 0;
    for (const b of CONFIG.bands) {
      const stalks = [];
      for (let i = 0; i < b.n; i++) {
        stalks.push({
          x: ((i + rand(-0.3, 0.3)) / b.n) * (W * 1.06) - W * 0.03,
          by: b.base + rand(-1, 1) * (bi >= 2 ? 0.018 : 0.006),
          h: rand(b.h[0], b.h[1]) * H,
          lean0: rand(-0.08, 0.08),
          ph: rand(0, Math.PI * 2),
          stiff: rand(0.75, 1.25),
          w: Math.max(1, rand(1.1, 2.1) * U * (1 + b.hazy * 0.6)),
        });
      }
      stalks.sort((a, b2) => a.x - b2.x);
      bandStalks.push(stalks);
      bi++;
    }
  }

  // wind: two travelling waves + noise gusts, in lean units
  function windAt(x, t) {
    const wave = 0.42 * Math.sin(x * 0.0032 - t * 1.35)
               + 0.28 * Math.sin(x * 0.0011 - t * 0.8 + 2.1);
    const gust = 0.55 * (fbm1(x * 0.0016 + t * 0.22) - 0.5) * 2;
    return wave + gust;
  }

  function drawBand(bi, t) {
    const b = CONFIG.bands[bi];
    const stalks = bandStalks[bi];

    // the crop mass each band rises out of; its top fades in so
    // neighbouring bands blend instead of terracing
    const gy = H * (b.base - 0.045);
    const gg = ctx.createLinearGradient(0, gy, 0, gy + H * 0.07);
    gg.addColorStop(0, 'rgba(0,0,0,0)');
    const gc = b.ground;
    gg.addColorStop(1, gc);
    ctx.fillStyle = gg;
    ctx.fillRect(0, gy, W, H * 0.07);
    ctx.fillStyle = gc;
    ctx.fillRect(0, gy + H * 0.07, W, H - gy - H * 0.07 + 2);

    ctx.lineCap = 'round';
    for (const s of stalks) {
      const baseY = H * s.by;
      const h = s.h;
      const wind = windAt(s.x, t) * s.stiff;
      const lean = s.lean0 + wind * 0.55;
      // control point half-way up, well leaned; tip follows further
      const cx = s.x + lean * h * 0.9;
      const cy = baseY - h * 0.55;
      const tipX = s.x + lean * h * 1.6 + Math.sin(t * 2.1 + s.ph) * h * 0.03;
      const tipY = baseY - h * (0.96 - Math.abs(wind) * 0.06);

      ctx.strokeStyle = b.col;
      ctx.lineWidth = s.w;
      ctx.beginPath();
      ctx.moveTo(s.x, baseY);
      ctx.quadraticCurveTo(cx, cy, tipX, tipY);
      ctx.stroke();

      // seed head: one tapered stroke along the tip direction
      const dx = tipX - cx, dy = tipY - cy;
      const dl = Math.hypot(dx, dy) || 1;
      const hl = h * 0.13;
      ctx.strokeStyle = b.head;
      ctx.lineWidth = Math.max(1.2, h * 0.05);
      ctx.beginPath();
      ctx.moveTo(tipX - (dx / dl) * hl * 0.35, tipY - (dy / dl) * hl * 0.35);
      ctx.lineTo(tipX + (dx / dl) * hl * 0.65, tipY + (dy / dl) * hl * 0.65);
      ctx.stroke();
      // a single awn on the near bands only
      if (bi >= 3) {
        ctx.lineWidth = Math.max(0.6, s.w * 0.35);
        ctx.beginPath();
        ctx.moveTo(tipX + (dx / dl) * hl * 0.5, tipY + (dy / dl) * hl * 0.5);
        ctx.quadraticCurveTo(
          tipX + (dx / dl) * hl * 1.3 + (dy / dl) * hl * 0.25,
          tipY + (dy / dl) * hl * 1.3 - (dx / dl) * hl * 0.25,
          tipX + (dx / dl) * hl * 2.0 + (dy / dl) * hl * 0.5,
          tipY + (dy / dl) * hl * 2.0 - (dx / dl) * hl * 0.5);
        ctx.stroke();
      }
    }
    // haze pooling over the far bands, gradient so no hard edge
    if (b.hazy > 0) {
      const y0 = H * (b.base - b.h[1] - 0.06);
      const hz = ctx.createLinearGradient(0, y0, 0, y0 + H * 0.16);
      hz.addColorStop(0, 'rgba(214, 160, 88, 0)');
      hz.addColorStop(0.55, `rgba(214, 160, 88, ${(b.hazy * 0.3).toFixed(3)})`);
      hz.addColorStop(1, 'rgba(214, 160, 88, 0)');
      ctx.fillStyle = hz;
      ctx.fillRect(0, y0, W, H * 0.16);
    }
  }

  // -------------------- leaves on the gusts --------------------
  let leaves = [];
  function makeLeafSprite(color) {
    const s = 24, c = document.createElement('canvas');
    c.width = c.height = s;
    const g = c.getContext('2d');
    g.translate(s / 2, s / 2);
    g.fillStyle = color;
    g.beginPath();
    const R = s * 0.42;
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + (i / 5) * Math.PI * 2;
      const mid = a + Math.PI / 5;
      g.quadraticCurveTo(Math.cos(a - 0.28) * R * 0.55, Math.sin(a - 0.28) * R * 0.55,
                         Math.cos(a) * R, Math.sin(a) * R);
      g.quadraticCurveTo(Math.cos(mid + 0.16) * R * 0.5, Math.sin(mid + 0.16) * R * 0.5,
                         Math.cos(mid) * R * 0.18, Math.sin(mid) * R * 0.18);
    }
    g.closePath();
    g.fill();
    return c;
  }
  const LEAF_COLORS = ['#a34e18', '#b8671f', '#8f3f14', '#a35a1c'];
  function buildLeaves() {
    leaves = [];
    for (let i = 0; i < CONFIG.leaves; i++) {
      leaves.push({
        spr: makeLeafSprite(LEAF_COLORS[i % LEAF_COLORS.length]),
        x: rand(-0.1, 1.1) * W,
        y: rand(0.45, 0.85) * H,
        vx: rand(60, 130),
        rot: rand(0, Math.PI * 2), vr: rand(-3, 3),
        s: rand(1.3, 2.3) * U * 10,
        ph: rand(0, Math.PI * 2),
        bob: rand(0.8, 1.8),
      });
    }
  }
  function drawLeaves(t, dt) {
    for (const l of leaves) {
      l.x += (l.vx + windAt(l.x, t) * 60) * dt;
      l.y += Math.sin(t * l.bob + l.ph) * 16 * dt;
      l.rot += l.vr * dt + windAt(l.x, t) * dt * 0.4;
      if (l.x > W + 40) {
        l.x = -40;
        l.y = rand(0.45, 0.85) * H;
      }
      ctx.save();
      ctx.translate(l.x, l.y);
      ctx.rotate(l.rot);
      ctx.globalAlpha = 0.9;
      ctx.drawImage(l.spr, -l.s / 2, -l.s / 2, l.s, l.s);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  // -------------------- resize / build --------------------
  function resize() {
    DPR = Math.min(CONFIG.dprCap, window.devicePixelRatio || 1);
    W = Math.floor(window.innerWidth);
    H = Math.floor(window.innerHeight);
    U = W / 1600;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    paintSky();
    buildStalks();
    buildLeaves();
  }
  window.addEventListener('resize', resize, { passive: true });
  resize();

  // -------------------- loop --------------------
  let last = performance.now();
  let ready = false;

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const t = now / 1000;

    ctx.drawImage(skyLayer, 0, 0, W, H);

    drawBand(0, t);
    drawBand(1, t);
    drawSunDisc();
    drawBand(2, t);
    drawLeaves(t, dt);
    drawBand(3, t);

    if (!ready) { ready = true; document.body.classList.add('ready'); }
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
