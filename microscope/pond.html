<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Pond Water</title>
  <style>
    html,body{ margin:0; height:100%; overflow:hidden; background:#0b0a06; }
    canvas{ display:block; width:100vw; height:100vh; }
    .vignette{
      pointer-events:none; position:fixed; inset:0;
      background:
        radial-gradient(104% 80% at 50% 46%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.5) 82%, rgba(0,0,0,0.88) 100%);
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="vignette"></div>
<script>
(() => {
  // A drop of pond water on a slide. Paramecia are slipper-shaped swimmers
  // with a fringe of beating cilia, a contractile vacuole that fills and
  // bursts, and food vacuoles drifting through the cytoplasm. The palette is
  // warm and low-contrast, the way phase contrast actually looks.
  const CFG = {
    dprCap: 2,
    swimmers: 9,
    algae: 34,
    detritus: 80,
    cilia: 34,             // cilia drawn per side of the body
  };

  const TAU = Math.PI * 2;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  let W = 0, H = 0, DPR = 1;

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);

  let swimmers = [];
  let algae = [];
  let detritus = [];
  let field = null;

  // ----------------------------------------------------------------- life

  function makeSwimmer() {
    return {
      x: rand(0.05, 0.95),
      y: rand(0.05, 0.95),
      vx: rand(-0.035, 0.035),
      vy: rand(-0.02, 0.02),
      len: rand(0.12, 0.2),
      fat: rand(0.19, 0.27),      // half-width as a fraction of length
      head: rand(0.6, 0.78),       // where along the body the front is
      ang: rand(0, TAU),
      turn: 0,
      turnRate: rand(-0.5, 0.5),
      wobble: rand(0, TAU),
      hue: rand(38, 54),
      dim: rand(0.5, 1),
      // contractile vacuole
      vac: Math.random(),
      vacRate: rand(0.16, 0.3),
      vacMax: rand(0.07, 0.11),
      // food vacuoles
      food: Array.from({ length: 4 + (Math.random() * 5 | 0) }, () => ({
        a: rand(0, TAU), d: rand(0.2, 0.78), s: rand(0.04, 0.085), spin: rand(-1, 1),
      })),
    };
  }

  function makeAlgae() {
    return {
      x: rand(0, 1), y: rand(0, 1),
      r: rand(3, 11),
      hue: rand(58, 96),
      drift: rand(-0.006, 0.006),
      wob: rand(0, TAU),
      // a few carry a chloroplast that turns with them
      turns: Math.random() < 0.35,
      spin: rand(0.3, 1.1) * (Math.random() < 0.5 ? -1 : 1),
      angle: rand(0, TAU),
    };
  }

  function buildScene() {
    swimmers = Array.from({ length: CFG.swimmers }, makeSwimmer);
    algae = Array.from({ length: CFG.algae }, makeAlgae);
    detritus = Array.from({ length: CFG.detritus }, () => ({
      x: rand(0, 1), y: rand(0, 1), r: rand(0.5, 2.2),
      drift: rand(-0.004, 0.004), wob: rand(0, TAU),
      tint: Math.random() < 0.5 ? '220,205,160' : '160,150,110',
    }));

    // Phase contrast shows a pale, slightly olive field with the organisms as
    // translucent shapes and a dark shadow cast beside each one.
    field = ctx.createRadialGradient(W * 0.5, H * 0.46, 0, W * 0.5, H * 0.46, Math.max(W, H) * 0.75);
    field.addColorStop(0, '#5b5539');
    field.addColorStop(0.45, '#3b3624');
    field.addColorStop(0.8, '#211f14');
    field.addColorStop(1, '#100f0a');
  }

  function resize() {
    DPR = Math.min(CFG.dprCap, window.devicePixelRatio || 1);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.max(1, Math.floor(W * DPR));
    canvas.height = Math.max(1, Math.floor(H * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildScene();
  }
  window.addEventListener('resize', resize, { passive: true });

  const pointer = { x: 0, y: 0, tx: 0, ty: 0, on: false };
  window.addEventListener('pointermove', (e) => {
    pointer.tx = (e.clientX / W) * 2 - 1;
    pointer.ty = (e.clientY / H) * 2 - 1;
    pointer.on = true;
  }, { passive: true });
  window.addEventListener('pointerleave', () => { pointer.on = false; }, { passive: true });

  // ---------------------------------------------------------------- motion

  function update(dt, time) {
    for (const s of swimmers) {
      // Paramecia spiral: they turn constantly and drift across the field.
      s.turn += s.turnRate * dt;
      const speed = Math.hypot(s.vx, s.vy) || 0.02;
      s.ang = Math.atan2(s.vy, s.vx) + s.turn * 0.55;
      s.vx += Math.cos(s.ang) * speed * 0.55 * dt;
      s.vy += Math.sin(s.ang) * speed * 0.55 * dt;
      // Gentle pull back toward cruising speed.
      const sp = Math.hypot(s.vx, s.vy);
      const want = 0.03 * s.dim;
      if (sp > 0) {
        const k = lerp(sp, want, 1 - Math.pow(0.25, dt));
        s.vx = (s.vx / sp) * k;
        s.vy = (s.vy / sp) * k;
      }
      s.x += s.vx * dt * 60 * 0.016;
      s.y += s.vy * dt * 60 * 0.016;
      s.wobble += dt * 7;

      // The vacuole fills slowly, then empties in a beat.
      s.vac += s.vacRate * dt;
      if (s.vac > 1) s.vac -= 1;

      const m = 0.14;
      if (s.x < -m) s.x += 1 + m * 2;
      if (s.x > 1 + m) s.x -= 1 + m * 2;
      if (s.y < -m) s.y += 1 + m * 2;
      if (s.y > 1 + m) s.y -= 1 + m * 2;
    }
    for (const a of algae) {
      a.x += a.drift * dt * 60 * 0.016;
      a.angle += a.spin * dt;
      if (a.x < -0.05) a.x += 1.1;
      if (a.x > 1.05) a.x -= 1.1;
    }
  }

  // --------------------------------------------------------------- drawing

  function drawBackdrop(time) {
    ctx.fillStyle = field;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const d of detritus) {
      ctx.globalAlpha = 0.1 + d.r * 0.06;
      ctx.fillStyle = `rgba(${d.tint},0.5)`;
      ctx.beginPath();
      ctx.arc(d.x * W + Math.sin(time * 0.3 + d.wob) * 5, d.y * H, d.r, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawAlgae(time) {
    for (const a of algae) {
      const x = a.x * W + Math.sin(time * 0.25 + a.wob) * 7;
      const y = a.y * H;
      ctx.beginPath();
      ctx.arc(x, y, a.r, 0, TAU);
      ctx.fillStyle = `hsla(${a.hue}, 38%, 44%, 0.3)`;
      ctx.fill();
      ctx.strokeStyle = `hsla(${a.hue + 6}, 52%, 84%, 0.42)`;
      ctx.lineWidth = 1.2;
      ctx.stroke();
      if (a.turns) {
        // Chloroplast: a crescent that reads as the cell is spinning.
        ctx.beginPath();
        ctx.ellipse(x, y, a.r * 0.62, a.r * 0.3, a.angle, 0, TAU);
        ctx.fillStyle = `hsla(${a.hue + 16}, 56%, 52%, 0.44)`;
        ctx.fill();
      }
    }
  }

  // Half-width of the body at t along its length, 0 tail → 1 nose. A rounded
  // cigar, blunt at both ends, which is roughly a paramecium's outline.
  function profileAt(t) {
    const q = (t - 0.52) * 2;
    return Math.pow(Math.max(0, 1 - q * q), 0.42);
  }

  // Centre line: straight, with a slight S from the oral groove.
  function spineAt(s, t, breathe) {
    return {
      x: (t - 0.5) * s.len * S(),
      y: Math.sin(t * Math.PI * 1.15) * s.len * S() * (0.1 + 0.02 * breathe),
    };
  }
  const S = () => Math.min(W, H);

  function bodyPath(s, breathe) {
    const halfW = s.fat * s.len * S();
    const steps = 32;
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const p = spineAt(s, t, breathe);
      const x = p.x;
      const y = p.y - halfW * profileAt(t) * (1 + breathe * 0.05);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    for (let i = steps; i >= 0; i--) {
      const t = i / steps;
      const p = spineAt(s, t, breathe);
      ctx.lineTo(p.x, p.y + halfW * profileAt(t) * (1 + breathe * 0.05));
    }
    ctx.closePath();
  }

  function drawSwimmer(s, time) {
    const L = s.len * S();
    const halfW = s.fat * L;
    const cx = s.x * W + pointer.x * 6;
    const cy = s.y * H + pointer.y * 6;
    const breathe = Math.sin(s.wobble) * 0.5 + 0.5;
    const hue = s.hue;
    const alpha = s.dim;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(s.ang);

    // Cilia: a fine fringe whose beat travels from back to front.
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = `hsla(${hue + 6}, 72%, 88%, ${0.22 * alpha})`;
    ctx.lineWidth = Math.max(0.5, L * 0.005);
    for (let i = 0; i < CFG.cilia; i++) {
      const t = (i + 0.5) / CFG.cilia;
      const beat = Math.sin(s.wobble * 1.7 - t * 6);
      const p = spineAt(s, t, breathe);
      const reach = halfW * profileAt(t);
      const len = reach * (0.28 + 0.3 * beat);
      for (const side of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(p.x, side * reach);
        // Cilia curve back as they beat.
        ctx.quadraticCurveTo(
          p.x + beat * L * 0.05, side * (reach + len * 0.6),
          p.x - len * 0.5, side * (reach + len));
        ctx.stroke();
      }
    }
    ctx.restore();

    // Cytoplasm
    bodyPath(s, breathe);
    const g = ctx.createLinearGradient(0, -halfW, 0, halfW);
    g.addColorStop(0, `hsla(${hue + 10}, 46%, 88%, ${0.5 * alpha})`);
    g.addColorStop(0.45, `hsla(${hue + 2}, 40%, 74%, ${0.36 * alpha})`);
    g.addColorStop(1, `hsla(${hue - 12}, 38%, 58%, ${0.5 * alpha})`);
    ctx.fillStyle = g;
    ctx.fill();

    // Phase contrast: a dark shadow just off the body, then a bright halo.
    ctx.save();
    ctx.translate(L * 0.035, L * 0.055);
    bodyPath(s, breathe);
    ctx.fillStyle = `hsla(${hue - 18}, 34%, 12%, ${0.3 * alpha})`;
    ctx.fill();
    ctx.restore();

    bodyPath(s, breathe);
    ctx.strokeStyle = `hsla(${hue + 24}, 88%, 97%, ${0.66 * alpha})`;
    ctx.lineWidth = Math.max(1, L * 0.018);
    ctx.stroke();

    // Macronucleus, the dark kidney in the middle.
    ctx.beginPath();
    ctx.ellipse(-L * 0.03, 0, L * 0.15, halfW * 0.4, 0.2, 0, TAU);
    ctx.fillStyle = `hsla(${hue - 10}, 42%, 20%, ${0.62 * alpha})`;
    ctx.fill();
    ctx.strokeStyle = `hsla(${hue + 20}, 60%, 82%, ${0.3 * alpha})`;
    ctx.lineWidth = Math.max(0.6, L * 0.008);
    ctx.stroke();

    // Food vacuoles riding the streaming cytoplasm.
    for (const f of s.food) {
      const a = f.a + time * 0.22 * f.spin;
      const x = Math.cos(a) * f.d * L * 0.34 - L * 0.05;
      const y = Math.sin(a) * f.d * halfW * 0.46;
      ctx.beginPath();
      ctx.arc(x, y, L * f.s, 0, TAU);
      ctx.fillStyle = `hsla(${88 + f.spin * 20}, 38%, 32%, ${0.4 * alpha})`;
      ctx.fill();
      ctx.strokeStyle = `hsla(${hue + 20}, 60%, 88%, ${0.34 * alpha})`;
      ctx.lineWidth = Math.max(0.5, L * 0.006);
      ctx.stroke();
    }

    // Contractile vacuole: a clear star that swells, then snaps shut.
    const fill = s.vac;
    const vr = s.vacMax * L * (0.3 + 0.7 * fill);
    const vx = L * 0.26;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.beginPath();
    for (let i = 0; i <= 18; i++) {
      const a = (i / 18) * TAU;
      const spike = 1 + 0.34 * Math.cos(a * 5) * (0.4 + 0.6 * fill);
      const px = vx + Math.cos(a) * vr * spike;
      const py = Math.sin(a) * vr * 0.7 * spike;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = `hsla(186, 66%, 84%, ${(0.16 + 0.2 * fill) * alpha})`;
    ctx.fill();
    ctx.strokeStyle = `hsla(186, 78%, 92%, ${0.34 * alpha})`;
    ctx.lineWidth = Math.max(0.6, L * 0.007);
    ctx.stroke();
    ctx.restore();

    ctx.restore();
  }

  // ------------------------------------------------------------------- loop

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const time = now / 1000;

    pointer.x = lerp(pointer.x, pointer.on ? pointer.tx : 0, 0.05);
    pointer.y = lerp(pointer.y, pointer.on ? pointer.ty : 0, 0.05);

    update(dt, time);

    drawBackdrop(time);
    drawAlgae(time);
    for (const s of swimmers) drawSwimmer(s, time);

    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
