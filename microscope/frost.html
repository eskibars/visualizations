<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Frost</title>
  <style>
    html,body{ margin:0; height:100%; overflow:hidden; background:#03070f; }
    canvas{ display:block; width:100vw; height:100vh; }
    .vignette{
      pointer-events:none; position:fixed; inset:0;
      background:
        radial-gradient(112% 86% at 50% 46%, rgba(0,0,0,0) 44%, rgba(0,0,0,0.5) 84%, rgba(0,0,0,0.88) 100%);
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="vignette"></div>
<script>
(() => {
  // A drop of water on a plate at -20°C. Ice grows at six corners and races
  // outward; every tip is slowed by the ice already around it, which is what
  // gives a real crystal its dense middle and its starved, feathery tips.
  const CFG = {
    dprCap: 2,
    arms: 6,
    gridCell: 13,          // crowding grid, in CSS px
    maxTips: 430,
    baseSpeed: 70,         // px per second at full speed
    growSeconds: 26,
    holdSeconds: 8,
    meltSeconds: 8,
    droplets: 44,
    warmup: 9,             // seconds of growth to run before the first paint
  };

  const TAU = Math.PI * 2;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  let W = 0, H = 0, DPR = 1, S = 1, cx = 0, cy = 0, reach = 1;

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);

  // The crystal is drawn into its own canvas and only ever appended to, so the
  // per-frame cost is the handful of new segments plus two blits.
  let plate = null;
  let pg = null;
  let glow = null;         // quarter-size bloom, refreshed a few times a second
  let ggc = null;
  let glowAge = 99;
  let mass = null;          // deposited ice per crowding cell
  let gw = 0, gh = 0;

  const tips = [];
  let phase = 'grow';
  let phaseTime = 0;
  let seedAngle = 0;
  let breathe = 0;

  function gridIndex(x, y) {
    const gx = clamp((x / CFG.gridCell) | 0, 0, gw - 1);
    const gy = clamp((y / CFG.gridCell) | 0, 0, gh - 1);
    return gy * gw + gx;
  }

  // ----------------------------------------------------------------- crystal

  function seedCrystal() {
    tips.length = 0;
    seedAngle = rand(0, TAU);
    const step = TAU / CFG.arms;
    for (let i = 0; i < CFG.arms; i++) {
      tips.push({
        x: cx + Math.cos(seedAngle + i * step) * reach * 0.07,
        y: cy + Math.sin(seedAngle + i * step) * reach * 0.07,
        ang: seedAngle + i * step,
        gen: 0,
        speed: rand(0.85, 1.15),
        budget: reach * rand(0.82, 0.98),
        branch: rand(2.5, 7),
        wobble: rand(0, TAU),
      });
    }
    phase = 'grow';
    phaseTime = 0;
  }

  // The seed plate: a flat hexagonal facet the dendrites grow out of.
  function drawSeedFacet() {
    const r = reach * 0.16;
    pg.beginPath();
    for (let i = 0; i <= 6; i++) {
      const a = seedAngle + (i / 6) * TAU;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      if (i === 0) pg.moveTo(x, y);
      else pg.lineTo(x, y);
    }
    pg.closePath();
    const g = pg.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, 'rgba(226,244,255,0.5)');
    g.addColorStop(0.7, 'rgba(160,210,255,0.3)');
    g.addColorStop(1, 'rgba(120,180,240,0.16)');
    pg.fillStyle = g;
    pg.fill();
    pg.strokeStyle = 'rgba(225,242,255,0.75)';
    pg.lineWidth = 1.8 * DPR;
    pg.stroke();
    // Growth ridges radiating from the centre of the facet.
    for (let i = 0; i < 6; i++) {
      const a = seedAngle + (i / 6) * TAU;
      pg.beginPath();
      pg.moveTo(cx, cy);
      pg.lineTo(cx + Math.cos(a) * r * 0.94, cy + Math.sin(a) * r * 0.94);
      pg.strokeStyle = 'rgba(200,232,255,0.4)';
      pg.lineWidth = 1 * DPR;
      pg.stroke();
    }
  }

  function advance(dt) {
    if (phase !== 'grow' || !tips.length) return;
    const step = CFG.baseSpeed * dt;

    for (let i = tips.length - 1; i >= 0; i--) {
      const t = tips[i];
      const crowd = mass[gridIndex(t.x, t.y)];
      const local = 1 / (1 + crowd * 0.05);
      const dist = Math.hypot(t.x - cx, t.y - cy) / reach;
      const radial = clamp(1.2 - dist * 0.3, 0.45, 1.2);
      const travel = step * t.speed * local * radial * (0.8 + 0.4 * (1 - local));

      // The budget is spent in distance, not time, so a starved tip still
      // finishes its arm instead of stalling where it was throttled.
      t.budget -= travel;
      if (t.budget <= 0) { tips.splice(i, 1); continue; }

      // Tips wander a little; a straight line looks drawn, a curled one looks
      // scratched. This much drift over a whole arm stays subtle.
      t.ang += Math.sin(breathe * 0.7 + t.wobble) * 0.014 * dt;
      const nx = t.x + Math.cos(t.ang) * travel;
      const ny = t.y + Math.sin(t.ang) * travel;

      // Thicker near the middle, needle-fine at the tip.
      const taper = Math.pow(1 - dist, 0.75);
      const width = Math.max(0.6, 3.4 * Math.pow(0.58, t.gen) * (0.2 + 0.8 * taper)) * DPR;
      const alpha = clamp(0.78 - dist * 0.42, 0.16, 0.78);

      // Core arms get a wide soft pass underneath, so they read as plates of
      // ice rather than as wire.
      if (t.gen === 0) {
        pg.strokeStyle = `rgba(150,205,250,${alpha * 0.16})`;
        pg.lineWidth = width * 3.4;
        pg.lineCap = 'round';
        pg.beginPath();
        pg.moveTo(t.x, t.y);
        pg.lineTo(nx, ny);
        pg.stroke();
      }

      pg.strokeStyle = `rgba(${212 - dist * 40},${238},255,${alpha})`;
      pg.lineWidth = width;
      pg.lineCap = 'round';
      pg.beginPath();
      pg.moveTo(t.x, t.y);
      pg.lineTo(nx, ny);
      pg.stroke();

      // Bookkeep the deposit so neighbouring tips starve each other.
      const cell = gridIndex(nx, ny);
      mass[cell] += 1 + t.gen * 0.3;
      const back = gridIndex(t.x, t.y);
      if (back !== cell) mass[back] += 0.5;

      t.x = nx;
      t.y = ny;

      // Side branches peel off at 60°, the angle ice likes. Once the tip budget
      // is spent, branching stops but every tip already alive keeps growing.
      t.branch -= travel;
      // The tip budget is global, but a crowded core must not starve the thin
      // outer arms: at the cap, only sparse ground is allowed to branch.
      const atCap = tips.length >= CFG.maxTips;
      const mayBranch = !atCap || mass[gridIndex(t.x, t.y)] < 2.5;
      if (t.branch <= 0 && mayBranch && t.gen < 4 && dist < 0.99) {
        t.branch = rand(2.5, 7);
        const side = Math.random() < 0.5 ? 1 : -1;
        tips.push({
          x: t.x, y: t.y,
          ang: t.ang + side * (Math.PI / 3),
          gen: t.gen + 1,
          speed: t.speed * rand(0.6, 0.9),
          // Side branches are short, and never so short they vanish — a branch
          // that scales straight off a spent parent leaves a bare arm.
          budget: clamp(Math.min(t.budget * rand(0.25, 0.45), reach * 0.22), reach * 0.05, reach * 0.24),
          branch: rand(2.5, 7),
          wobble: rand(0, TAU),
        });
      }
    }
  }

  // Melt: erase the plate a little each frame, strongest where it is thinnest.
  function melt(dt) {
    pg.save();
    pg.globalCompositeOperation = 'destination-out';
    const a = 0.55 * (dt / CFG.meltSeconds);
    pg.fillStyle = `rgba(0,0,0,${a})`;
    pg.fillRect(0, 0, plate.width, plate.height);
    pg.restore();
  }

  // ------------------------------------------------------------------ scene

  let droplets = [];
  let haze = null;
  let puff = null;        // one soft blob, blitted instead of rebuilding gradients

  function buildPuff() {
    const size = 256;
    const c = document.createElement('canvas');
    c.width = size;
    c.height = size;
    const g2 = c.getContext('2d');
    const g = g2.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    g.addColorStop(0, 'rgba(90,150,210,1)');
    g.addColorStop(0.55, 'rgba(90,150,210,0.34)');
    g.addColorStop(1, 'rgba(90,150,210,0)');
    g2.fillStyle = g;
    g2.fillRect(0, 0, size, size);
    return c;
  }

  function buildScene() {
    mass = new Float32Array(gw * gh);
    plate = document.createElement('canvas');
    plate.width = canvas.width;
    plate.height = canvas.height;
    pg = plate.getContext('2d');
    pg.setTransform(DPR, 0, 0, DPR, 0, 0);
    pg.lineJoin = 'round';

    // A quarter-size copy stands in for a bloom. Refreshing it a few times a
    // second is far cheaper than blurring the full plate every frame, and the
    // upscale does the softening for free.
    glow = document.createElement('canvas');
    glow.width = Math.max(1, plate.width >> 2);
    glow.height = Math.max(1, plate.height >> 2);
    ggc = glow.getContext('2d');
    glowAge = 99;

    seedCrystal();
    drawSeedFacet();

    droplets = Array.from({ length: CFG.droplets }, () => makeDroplet(true));
    puff = buildPuff();

    haze = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.8);
    haze.addColorStop(0, 'rgba(40,90,150,0.34)');
    haze.addColorStop(0.4, 'rgba(18,44,84,0.14)');
    haze.addColorStop(1, 'rgba(2,6,16,0)');
  }

  function makeDroplet(anywhere) {
    return {
      x: rand(0, W),
      y: anywhere ? rand(0, H) : rand(-0.05, 0) * H,
      r: rand(1.2, 6.5),
      speed: rand(4, 26),
      wob: rand(0, TAU),
    };
  }

  function resize() {
    DPR = Math.min(CFG.dprCap, window.devicePixelRatio || 1);
    W = window.innerWidth;
    H = window.innerHeight;
    S = Math.min(W, H);
    canvas.width = Math.max(1, Math.floor(W * DPR));
    canvas.height = Math.max(1, Math.floor(H * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W / 2;
    cy = H / 2;
    reach = S * 0.62;
    gw = Math.max(1, Math.ceil(W / CFG.gridCell));
    gh = Math.max(1, Math.ceil(H / CFG.gridCell));
    buildScene();
    // Grow the first crystal off-screen so the piece never opens on bare glass.
    const warm = 1 / 60;
    for (let i = 0; i < CFG.warmup * 60; i++) { breathe += warm; advance(warm); }
    phase = 'hold';
    phaseTime = 0;
  }
  window.addEventListener('resize', resize, { passive: true });

  const pointer = { x: 0, y: 0, tx: 0, ty: 0, on: false };
  window.addEventListener('pointermove', (e) => {
    pointer.tx = (e.clientX / W) * 2 - 1;
    pointer.ty = (e.clientY / H) * 2 - 1;
    pointer.on = true;
  }, { passive: true });
  window.addEventListener('pointerleave', () => { pointer.on = false; }, { passive: true });

  function drawBackdrop(time) {
    ctx.fillStyle = '#03070f';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = haze;
    ctx.fillRect(0, 0, W, H);

    // Breath of vapour off the cold plate. One pre-baked blob, scaled and
    // faded, beats building three full-screen gradients every frame.
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 3; i++) {
      const t = (time * 0.035 + i * 0.33) % 1;
      const r = lerp(reach * 0.45, Math.max(W, H) * 0.8, t);
      ctx.globalAlpha = 0.035 * (1 - t);
      ctx.drawImage(puff, cx - r, cy - r, r * 2, r * 2);
    }
    ctx.restore();
  }

  function drawDroplets(dt, time) {
    for (const d of droplets) {
      d.y += d.speed * dt;
      d.x += Math.sin(time * 0.6 + d.wob) * 6 * dt;
      if (d.y - d.r > H) Object.assign(d, makeDroplet(false));
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, TAU);
      ctx.fillStyle = 'rgba(150,200,245,0.05)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(d.x - d.r * 0.3, d.y - d.r * 0.3, d.r * 0.78, Math.PI * 0.7, Math.PI * 1.6);
      ctx.strokeStyle = 'rgba(215,240,255,0.3)';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }
  }

  function drawCrystal(time) {
    const flicker = 0.92 + 0.08 * Math.sin(time * 0.7);

    if (glowAge > 4) {
      ggc.clearRect(0, 0, glow.width, glow.height);
      ggc.filter = `blur(${Math.max(1, 1.6 * DPR)}px)`;
      ggc.drawImage(plate, 0, 0, glow.width, glow.height);
      ggc.filter = 'none';
      glowAge = 0;
    }
    glowAge++;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    // Bloom first, then the crystal itself over the top.
    const breatheScale = 1.01 + 0.006 * Math.sin(time * 0.45);
    ctx.globalAlpha = (phase === 'melt' ? 0.5 : 0.62) * flicker;
    ctx.drawImage(glow, cx - (W / 2) * breatheScale, cy - (H / 2) * breatheScale, W * breatheScale, H * breatheScale);

    const shift = 1 + 0.006;
    ctx.globalAlpha = (phase === 'melt' ? 0.8 : 0.92) * flicker;
    ctx.drawImage(plate, cx - (W / 2) * shift + pointer.x * 2, cy - (H / 2) * shift + pointer.y * 2, W * shift, H * shift);
    ctx.restore();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const time = now / 1000;
    breathe += dt;
    phaseTime += dt;

    pointer.x = lerp(pointer.x, pointer.on ? pointer.tx : 0, 0.03);
    pointer.y = lerp(pointer.y, pointer.on ? pointer.ty : 0, 0.03);

    if (phase === 'grow') {
      advance(dt);
      if (phaseTime > CFG.growSeconds) { phase = 'hold'; phaseTime = 0; }
    } else if (phase === 'hold') {
      if (phaseTime > CFG.holdSeconds) { phase = 'melt'; phaseTime = 0; }
    } else if (phase === 'melt') {
      melt(dt);
      if (phaseTime > CFG.meltSeconds) buildScene();
    }

    drawBackdrop(time);
    drawDroplets(dt, time);
    drawCrystal(time);

    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
