<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="color-scheme" content="dark"/>
  <title>Vector Scope</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #060a08; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .vignette {
      pointer-events: none; position: fixed; inset: 0;
      background: radial-gradient(ellipse 124% 100% at 50% 48%,
        rgba(0,0,0,0) 46%, rgba(0,0,0,.34) 82%, rgba(0,0,0,.80) 100%);
      mix-blend-mode: multiply;
    }
    .glass {
      pointer-events: none; position: fixed; inset: 0;
      background: radial-gradient(ellipse 60% 46% at 34% 24%,
        rgba(180, 255, 220, .06) 0%, rgba(120, 255, 200, 0) 60%);
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="glass"></div>
  <div class="vignette"></div>
<script>
(() => {
  "use strict";

  // ============================================================
  //  VECTOR SCOPE — a phosphor oscilloscope, drawn the way one
  //  actually draws: a beam sweeping a graticule, leaving a glow
  //  that decays behind it. Two traces run at different
  //  frequencies so they beat against each other, a Lissajous
  //  inset in the corner shows the phase relationship, and the
  //  whole tube has the slight lag of a slow-phosphor screen.
  //
  //  Construction notes
  //  ------------------
  //  The decay is the whole effect and also the whole cost: the
  //  obvious implementation draws the trace into a canvas and fades
  //  it every frame. That is a full-screen composite per frame. It
  //  is done here at quarter resolution and scaled up, which is
  //  both much cheaper and closer to the soft, blooming look of a
  //  real tube.
  // ============================================================
  const CONFIG = {
    //  The trace layer is a quarter-res composite, so the display canvas does not
    //  need to carry the cost of a full-resolution decay.
    dprCap: 1.6,

    decayScale: 0.5,         // trace layer resolution, as a fraction of the canvas
    /*  Alpha of the fade applied to the trace layer each frame.
        This is the whole character of the piece and it has to be tuned against
        the trace speed, not on its own. At 0.055 with the traces running at
        1.0-1.6 Hz, a sweep took long enough that several dozen past sweeps were
        still visible, and the tube filled in as a solid mesh instead of reading
        as a beam leaving a fading line. At 0.30 each sweep is clearly a line
        that fades over about a fifth of a second. */
    decay: 0.30,
    traces: 2,
    //  Low frequencies: a scope showing a slow signal is legible; a fast one is
    //  a texture. These are deliberately well under 1 Hz.
    traceHz: [0.26, 0.40],
    sweepHz: 0.22,
    lissajousHz: [1.0, 1.5],
    graticule: 10,
  };

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d", { alpha: false });
  let W = 0, H = 0, DPR = 1, U = 1;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  const TAU = Math.PI * 2;

  // ---------------- trace layer ----------------
  //  The phosphor itself: an offscreen canvas that is faded rather than cleared,
  //  so what the beam drew last frame is still faintly there.
  let trace = null;
  let tctx = null;
  let tw = 1, th = 1;

  function sizeTrace() {
    tw = Math.max(1, Math.round(W * DPR * CONFIG.decayScale));
    th = Math.max(1, Math.round(H * DPR * CONFIG.decayScale));
    if (!trace) trace = document.createElement("canvas");
    trace.width = tw;
    trace.height = th;
    tctx = trace.getContext("2d");
    // Ground is opaque black so the trace layer composites cleanly.
    tctx.setTransform(1, 0, 0, 1, 0, 0);
    tctx.fillStyle = "#000";
    tctx.fillRect(0, 0, tw, th);
  }

  // ---------------- graticule ----------------
  //  The etched grid inside the tube. Drawn once per resize, since it never
  //  changes and is the most detailed part of the frame.
  let graticule = null;
  function paintGraticule() {
    if (!graticule) graticule = document.createElement("canvas");
    graticule.width = Math.max(1, Math.floor(W * DPR));
    graticule.height = Math.max(1, Math.floor(H * DPR));
    const g = graticule.getContext("2d");
    g.setTransform(DPR, 0, 0, DPR, 0, 0);

    // The tube's phosphor base colour, very dark green.
    g.fillStyle = "#08130d";
    g.fillRect(0, 0, W, H);
    // Slight vignette burned into the glass.
    const vig = g.createRadialGradient(W * 0.5, H * 0.5, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.66);
    vig.addColorStop(0, "rgba(0,0,0,0)");
    vig.addColorStop(0.62, "rgba(0,0,0,0.18)");
    vig.addColorStop(1, "rgba(0,0,0,0.62)");
    g.fillStyle = vig;
    g.fillRect(0, 0, W, H);

    const cols = CONFIG.graticule;
    const rows = Math.round(cols * (H / W) * 1.4) || 8;
    const cw = W / cols;
    const ch = H / (rows + 2);

    g.strokeStyle = "rgba(70, 200, 140, 0.16)";
    g.lineWidth = 1;
    // Fine sub-divisions.
    for (let i = 0; i <= cols * 5; i++) {
      const x = (i / (cols * 5)) * W;
      if (i % 5 === 0) continue;
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke();
    }
    for (let i = 0; i <= (rows + 2) * 5; i++) {
      const y = (i / ((rows + 2) * 5)) * H;
      if (i % 5 === 0) continue;
      g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
    }
    // Major divisions, brighter.
    g.strokeStyle = "rgba(90, 230, 165, 0.30)";
    g.lineWidth = 1.2;
    for (let i = 0; i <= cols; i++) {
      const x = i * cw;
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke();
    }
    for (let i = 0; i <= rows + 2; i++) {
      const y = i * ch;
      g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
    }
    // The centre axes, brightest.
    g.strokeStyle = "rgba(120, 255, 190, 0.42)";
    g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(W / 2, 0); g.lineTo(W / 2, H); g.stroke();
    g.beginPath(); g.moveTo(0, H / 2); g.lineTo(W, H / 2); g.stroke();

    // Tick marks, as a real scope carries.
    g.strokeStyle = "rgba(120, 255, 190, 0.30)";
    g.lineWidth = 1.2;
    for (let i = 0; i <= cols * 5; i++) {
      const x = (i / (cols * 5)) * W;
      const long = i % 5 === 0;
      g.beginPath();
      g.moveTo(x, H / 2 - (long ? 9 : 4));
      g.lineTo(x, H / 2 + (long ? 9 : 4));
      g.stroke();
    }
    for (let i = 0; i <= (rows + 2) * 5; i++) {
      const y = (i / ((rows + 2) * 5)) * H;
      const long = i % 5 === 0;
      g.beginPath();
      g.moveTo(W / 2 - (long ? 9 : 4), y);
      g.lineTo(W / 2 + (long ? 9 : 4), y);
      g.stroke();
    }

    // Scale legends, as the corners of a scope's graticule have.
    g.fillStyle = "rgba(120, 255, 190, 0.34)";
    g.font = "600 11px ui-monospace, Menlo, monospace";
    g.textBaseline = "top";
    g.textAlign = "left";
    g.fillText("CH1  0.5 V/div", 12, 10);
    g.fillText("CH2  0.2 V/div", 12, 26);
    g.textAlign = "right";
    g.fillText("2 ms/div", W - 12, 10);
    g.fillText("TRIG AUTO", W - 12, 26);
  }

  // ---------------- signals ----------------
  //  Two traces, each a sum of a fundamental and a couple of harmonics, with a
  //  slow amplitude wander. That gives a signal that is clearly periodic but
  //  never repeats exactly, which is what holds the eye on a scope.
  const SIG = [
    { f: 1.0, a: [1.0, 0.30, 0.14], ph: [0, 1.1, 2.4], hue: 145, wander: 0.18 },
    { f: 1.6, a: [0.8, 0.42, 0.10], ph: [0.7, 2.2, 0.4], hue: 190, wander: 0.24 },
  ];

  function signalValue(sig, x, time) {
    // x is 0..1 across the screen; one full cycle spans the width.
    const w = time * CONFIG.traceHz[SIG.indexOf(sig)] * TAU;
    let v = 0;
    for (let k = 0; k < sig.a.length; k++) {
      v += sig.a[k] * Math.sin((k + 1) * x * TAU * sig.f + w * (k + 1) + sig.ph[k]);
    }
    // A slow amplitude wander, so the trace breathes.
    const wander = 1 + sig.wander * Math.sin(time * 0.23 + sig.ph[0]);
    return v * wander * 0.22;
  }

  function drawTraces(time) {
    // The beam draws into the trace layer at its own resolution.
    tctx.setTransform(1, 0, 0, 1, 0, 0);
    // Fade rather than clear: this is the phosphor decay.
    tctx.globalCompositeOperation = "source-over";
    tctx.fillStyle = `rgba(0, 0, 0, ${CONFIG.decay})`;
    tctx.fillRect(0, 0, tw, th);

    tctx.globalCompositeOperation = "lighter";
    const steps = 420;
    for (let s = 0; s < SIG.length; s++) {
      const sig = SIG[s];
      tctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const x = i / steps;
        const v = signalValue(sig, x, time);
        const px = x * tw;
        const py = th * 0.5 - v * th;
        if (i === 0) tctx.moveTo(px, py); else tctx.lineTo(px, py);
      }
      // A bright core plus a wide soft halo, which is what a phosphor trace is.
      tctx.strokeStyle = `hsla(${sig.hue}, 100%, 62%, 0.55)`;
      tctx.lineWidth = 3.2;
      tctx.lineJoin = "round";
      tctx.stroke();
      tctx.strokeStyle = `hsla(${sig.hue}, 100%, 78%, 0.85)`;
      tctx.lineWidth = 1.2;
      tctx.stroke();
    }

    //  The beam's own dot, at the current sweep position. It is brighter than
    //  anything else on the tube, as a real beam is.
    const sweep = (time * CONFIG.sweepHz) % 1;
    const sx = sweep * tw;
    for (let s = 0; s < SIG.length; s++) {
      const sig = SIG[s];
      const v = signalValue(sig, sweep, time);
      const sy = th * 0.5 - v * th;
      const g = tctx.createRadialGradient(sx, sy, 0, sx, sy, 26);
      g.addColorStop(0, `hsla(${sig.hue}, 100%, 96%, 0.85)`);
      g.addColorStop(0.3, `hsla(${sig.hue}, 100%, 74%, 0.35)`);
      g.addColorStop(1, `hsla(${sig.hue}, 100%, 60%, 0)`);
      tctx.fillStyle = g;
      tctx.beginPath(); tctx.arc(sx, sy, 26, 0, TAU); tctx.fill();
    }
  }

  function drawLissajous(time) {
    //  A small phase inset in the corner, in the space the scale legends leave.
    //  This is the one place where the two channels' relationship is visible
    //  rather than implied.
    const r = Math.min(W, H) * 0.115;
    const cx = W - r - W * 0.045;
    const cy = H - r - H * 0.075;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.strokeStyle = "rgba(90, 230, 200, 0.22)";
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
    ctx.fillStyle = "rgba(90, 230, 200, 0.10)";
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();

    ctx.beginPath();
    for (let i = 0; i <= 480; i++) {
      const t = (i / 480) * TAU;
      const x = cx + Math.sin(t * CONFIG.lissajousHz[0] + time * 0.20) * r * 0.86;
      const y = cy + Math.sin(t * CONFIG.lissajousHz[1] + time * 0.26 + 0.7) * r * 0.86;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = "rgba(120, 255, 210, 0.42)";
    ctx.lineWidth = 1.3;
    ctx.stroke();
    ctx.restore();
  }

  // ---------------- loop ----------------
  let last = performance.now();
  let ready = false;
  const start = performance.now();

  function resize() {
    DPR = Math.min(CONFIG.dprCap, window.devicePixelRatio || 1);
    W = Math.max(1, Math.floor(window.innerWidth));
    H = Math.max(1, Math.floor(window.innerHeight));
    U = Math.min(W, H);
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    sizeTrace();
    paintGraticule();
  }
  window.addEventListener("resize", resize, { passive: true });

  function frame(now) {
    const time = (now - start) / 1000;
    last = now;

    drawTraces(time);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.drawImage(graticule, 0, 0, W, H);
    // The trace layer over the graticule, in screen mode so the beam adds to
    // the etched grid rather than hiding it.
    ctx.save();
    ctx.globalCompositeOperation = "screen";
    ctx.globalAlpha = 0.92;
    ctx.drawImage(trace, 0, 0, W, H);
    ctx.restore();
    drawLissajous(time);

    if (!ready) { ready = true; document.body.classList.add("ready"); }
    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
