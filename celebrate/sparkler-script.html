<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="color-scheme" content="dark"/>
  <title>Sparkler Script</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #060508; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .vignette {
      pointer-events: none; position: fixed; inset: 0;
      background: radial-gradient(ellipse 128% 104% at 50% 44%,
        rgba(0,0,0,0) 42%, rgba(0,0,0,.32) 82%, rgba(0,0,0,.8) 100%);
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="vignette"></div>
<script>
(() => {
  "use strict";

  // ============================================================
  //  SPARKLER SCRIPT — a sparkler writes the evening's words.
  //  It flies along each letterform shedding sparks, the stroke
  //  it leaves burning bright and slowly dying to a whisper.
  //  Then it lifts, loops, and swoops off to write the next word
  //  somewhere else on the dark, forever — a screensaver, not a
  //  finale.
  //
  //  Construction notes
  //  ------------------
  //  The letterforms are hand-drawn single-stroke cursive
  //  glyphs — quadratic chains in a small design space — because
  //  a sparkler draws strokes, not filled type. Each glyph is
  //  sampled to a point list with pen-lift breaks (the j's dot is
  //  a pen-lift detour the sparkler darts up to dab), letters are
  //  chained with their cursive connectors, and the sparkler
  //  walks the combined path at writing speed. Words are placed
  //  away from whichever words are still glowing, and the burn
  //  dies fully within roughly one word-cycle, so the writing
  //  always stays legible. Strokes are kept as timed segments and
  //  the ink canvas is rebuilt each frame with exact age-based
  //  alpha — fading in place on an 8-bit canvas stalls at a
  //  permanent ghost floor. Sparks are pooled particles under
  //  gravity and drag.
  // ============================================================
  const CONFIG = {
    dprCap: 1.6,

    // every word here has been proofed letter-by-letter for
    // legibility in the single-stroke glyph set below
    words: ['hello', 'joy', 'hooray', 'cheers', 'jolly', '2026'],

    glyphHeight: 0.34,        // design space maps to this fraction of H
    wordScale: [0.85, 1.25],  // per-word size variation
    writeSpeed: 420,          // px/s along the path
    sparksPerFrame: 9,
    inkFade: 0.30,            // 1/s exponential decay of the burn
    holdAfterWord: [0.9, 1.6],
  };

  // -------------------- glyph table --------------------
  //  Quadratic chains. Design space: baseline y=0, x-height ~-56,
  //  ascender ~-118, descender ~+42. One glyph per needed letter;
  //  'adv' is the advance width. Glyphs start low on their right
  //  rim or baseline so the incoming cursive connector stays short.
  const GLYPHS = {
    h: { adv: 66, segs: [[
      ['M', 2, 8], ['Q', 8, -60, 14, -96], ['Q', 18, -118, 24, -110],
      ['Q', 28, -102, 25, -78], ['Q', 20, -36, 24, -4],
    ], [
      ['M', 24, -4], ['Q', 28, -48, 36, -60], ['Q', 47, -68, 49, -46],
      ['Q', 50, -22, 53, -8], ['Q', 56, 2, 64, 4],
    ]] },
    e: { adv: 44, segs: [[
      ['M', 0, 6], ['Q', 2, -24, 10, -42], ['Q', 16, -54, 25, -49],
      ['Q', 33, -43, 31, -26], ['Q', 29, -10, 20, -4],
      ['Q', 8, 3, 4, 2], ['Q', 0, 1, 6, 1],
      ['Q', 16, 3, 28, 1], ['Q', 34, 0, 40, 2],
    ]] },
    l: { adv: 40, segs: [[
      ['M', 2, 8], ['Q', 6, -56, 11, -96], ['Q', 14, -118, 19, -111],
      ['Q', 23, -104, 21, -80], ['Q', 17, -36, 20, -4], ['Q', 22, 4, 32, 2],
    ]] },
    o: { adv: 48, segs: [[
      ['M', 31, -10], ['Q', 29, -40, 18, -50], ['Q', 5, -58, 3, -37],
      ['Q', 1, -15, 13, -5], ['Q', 23, 3, 28, -8],
      ['Q', 30, -20, 28, -34], ['Q', 26, -42, 32, -42],
      ['Q', 39, -41, 43, -28], ['Q', 46, -17, 47, -4],
    ]] },
    j: { adv: 34, segs: [[
      ['M', 0, 4], ['Q', 4, -24, 8, -46],
    ], [
      ['M', 11, -74], ['Q', 15, -75, 14, -70], ['Q', 13, -65, 9, -69],
    ], [
      ['M', 8, -46], ['Q', 12, -12, 12, 10], ['Q', 12, 30, 4, 38],
      ['Q', -4, 46, -2, 30], ['Q', 0, 14, 12, 5], ['Q', 20, -2, 32, 0],
    ]] },
    y: { adv: 46, segs: [[
      ['M', 0, 4], ['Q', 9, -28, 17, -46], ['Q', 22, -56, 25, -45],
      ['Q', 30, -24, 30, -10], ['Q', 29, 3, 22, -3],
      ['Q', 13, -18, 15, -38], ['Q', 21, -54, 26, -42],
      ['Q', 32, -18, 33, 2], ['Q', 34, 16, 28, 26],
      ['Q', 21, 35, 11, 31], ['Q', 3, 26, 6, 17],
      ['Q', 9, 9, 15, 5], ['Q', 23, 0, 34, 0],
    ]] },
    r: { adv: 46, segs: [[
      ['M', 0, 4], ['Q', 8, -32, 15, -52],
      ['Q', 18, -56, 20, -51], ['Q', 23, -42, 27, -40],
      ['Q', 31, -39, 32, -45], ['Q', 33, -30, 32, -12],
      ['Q', 31, -2, 33, -1], ['Q', 39, 0, 45, 0],
    ]] },
    a: { adv: 52, segs: [[
      ['M', 26, -10], ['Q', 25, -38, 15, -49], ['Q', 4, -57, 3, -36],
      ['Q', 2, -15, 12, -5], ['Q', 21, 2, 25, -8],
      ['Q', 32, -18, 33, -30], ['Q', 33, -14, 32, -2], ['Q', 31, 5, 33, 5],
      ['Q', 36, 9, 44, 4], ['Q', 50, 1, 54, 0],
    ]] },
    c: { adv: 40, segs: [[
      ['M', 36, -18], ['Q', 31, -52, 13, -56], ['Q', 0, -58, 2, -36],
      ['Q', 4, -14, 16, -4], ['Q', 26, 3, 36, 0],
    ]] },
    s: { adv: 34, segs: [[
      ['M', 0, 4], ['Q', 6, -16, 11, -30], ['Q', 15, -42, 19, -46],
      ['Q', 24, -49, 23, -41], ['Q', 21, -30, 15, -22],
      ['Q', 8, -13, 7, -6], ['Q', 5, 2, 12, 3], ['Q', 21, 5, 28, 1],
    ]] },
    2: { adv: 40, segs: [[
      ['M', 4, -18], ['Q', 2, -48, 20, -58], ['Q', 36, -64, 38, -44],
      ['Q', 39, -24, 6, 2], ['Q', 20, -2, 40, 0],
    ]] },
    0: { adv: 40, segs: [[
      ['M', 30, -40], ['Q', 28, -70, 18, -75], ['Q', 6, -78, 5, -48],
      ['Q', 4, -18, 14, -8], ['Q', 24, 0, 28, -18], ['Q', 30, -30, 30, -40],
    ]] },
    6: { adv: 40, segs: [[
      ['M', 30, -70], ['Q', 12, -64, 8, -36], ['Q', 5, -12, 18, -6],
      ['Q', 28, -1, 32, -14], ['Q', 35, -28, 26, -34], ['Q', 14, -40, 10, -24],
    ]] },
  };

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  let W = 0, H = 0, DPR = 1, U = 1;

  function rand(a, b) { return a + Math.random() * (b - a); }

  // -------------------- sprites --------------------
  function makeGlow(r, g, b) {
    const s = 128, c = document.createElement('canvas');
    c.width = c.height = s;
    const g2 = c.getContext('2d');
    const grad = g2.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    grad.addColorStop(0, `rgba(${r},${g},${b},1)`);
    grad.addColorStop(0.25, `rgba(${r},${g},${b},.55)`);
    grad.addColorStop(0.6, `rgba(${r},${g},${b},.16)`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    g2.fillStyle = grad;
    g2.fillRect(0, 0, s, s);
    return c;
  }
  const glowHot = makeGlow(255, 240, 214);
  const glowWarm = makeGlow(255, 198, 120);

  function stampAt(g, sprite, x, y, size, alpha) {
    if (alpha <= 0.004) return;
    g.globalAlpha = Math.min(1, alpha);
    g.drawImage(sprite, x - size / 2, y - size / 2, size, size);
    g.globalAlpha = 1;
  }

  // -------------------- word path building --------------------
  //  Sample a glyph's segments into points: {x, y, ink} where
  //  ink=false marks the first point after a pen lift (and the
  //  un-inked approach to the j's dot).
  function sampleGlyph(glyph, s) {
    const pts = [];
    for (const seg of glyph.segs) {
      let cx = 0, cy = 0;
      let first = true;
      for (const cmd of seg) {
        if (cmd[0] === 'M') {
          cx = cmd[1] * s; cy = cmd[2] * s;
          pts.push({ x: cx, y: cy, ink: !first || pts.length === 0 });
          first = false;
        } else {   // Q
          const qx = cmd[1] * s, qy = cmd[2] * s;
          const ex = cmd[3] * s, ey = cmd[4] * s;
          const steps = 9;
          for (let i = 1; i <= steps; i++) {
            const u = i / steps, v = 1 - u;
            pts.push({
              x: v * v * cx + 2 * v * u * qx + u * u * ex,
              y: v * v * cy + 2 * v * u * qy + u * u * ey,
              ink: true,
            });
          }
          cx = ex; cy = ey;
        }
      }
    }
    return pts;
  }

  //  A word is one combined path: letters in order, joined by
  //  cursive connectors (inked), with per-point cumulative length.
  function buildWord(word, ox, oy, unit) {
    const pts = [];
    let penX = 0;
    for (const ch of word) {
      const glyph = GLYPHS[ch];
      if (!glyph) { penX += 30 * unit; continue; }
      const gp = sampleGlyph(glyph, unit);
      for (const p of gp) {
        pts.push({ x: ox + (penX + p.x), y: oy + p.y, ink: p.ink });
      }
      penX += glyph.adv * unit;
    }
    // two rounds of Chaikin corner-cutting, never across a pen
    // lift, so the sampled chains flow like real script
    for (let round = 0; round < 2; round++) {
      const out = [];
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i];
        const b = pts[i + 1];
        const cut = !b || !a.ink || !b.ink;   // segment ends here
        if (cut) { out.push({ x: a.x, y: a.y, ink: a.ink }); continue; }
        out.push({ x: a.x * 0.75 + b.x * 0.25, y: a.y * 0.75 + b.y * 0.25, ink: i === 0 ? a.ink : true });
        out.push({ x: a.x * 0.25 + b.x * 0.75, y: a.y * 0.25 + b.y * 0.75, ink: true });
      }
      pts.length = 0;
      for (const p of out) pts.push(p);
    }
    const cum = [0];
    for (let i = 1; i < pts.length; i++) {
      cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
    }
    return { pts, cum, len: cum[cum.length - 1] };
  }

  function pathPos(wr, d) {
    const { pts, cum } = wr;
    let lo = 0, hi = cum.length - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (cum[mid] < d) lo = mid + 1; else hi = mid;
    }
    const i = Math.max(1, lo);
    const t = (d - cum[i - 1]) / Math.max(1e-6, cum[i] - cum[i - 1]);
    const a = pts[i - 1], b = pts[i];
    return {
      x: a.x + (b.x - a.x) * t,
      y: a.y + (b.y - a.y) * t,
      ink: a.ink && b.ink,
    };
  }

  // -------------------- placement --------------------
  //  Words land somewhere new each time: candidates are rejected
  //  while any still-glowing ink lingers inside the word's box.
  function placeWord(word, unit, now) {
    let adv = 0;
    for (const ch of word) adv += (GLYPHS[ch] ? GLYPHS[ch].adv : 30) * unit;
    const w = adv;
    const minX = w / 2 + W * 0.03, maxX = W - w / 2 - W * 0.03;
    const minY = Math.max(H * 0.30, 118 * unit + H * 0.02);
    const maxY = Math.min(H * 0.80, H * 0.96 - 46 * unit);
    const by = (base) => ({
      x0: base.x - w / 2, x1: base.x + w / 2,
      y0: base.y - 118 * unit, y1: base.y + 46 * unit,
    });
    const pad = H * 0.05;
    let best = null;
    for (let i = 0; i < 50; i++) {
      const c = {
        x: rand(minX, Math.max(minX + 1, maxX)),
        y: rand(Math.min(minY, maxY - 1), maxY),
      };
      const box = by(c);
      box.x0 -= pad; box.x1 += pad; box.y0 -= pad; box.y1 += pad;
      if (inkVisibleIn(box, now)) continue;
      best = c;
      if (Math.random() < 0.35) break;   // uniform over free space; extra sampling adds spread
    }
    if (!best) best = { x: W / 2, y: H * (0.42 + 0.3 * Math.random()) };
    return { x: best.x - adv / 2, y: best.y };
  }

  // -------------------- ink layer --------------------
  //  Strokes are kept as segments with birth times and the ink
  //  canvas is rebuilt each frame: alpha is an exact function of
  //  age, hard-terminating at zero. (A persistent canvas faded in
  //  place stalls at a visible ~2% ghost floor — 8-bit alpha
  //  rounding — and old words pile into a scribble veil.)
  let ink, inkCtx;
  const MAX_AGE = 12;              // s — fully faded beyond this
  const KNEE = 9;                  // s — ease into the cutoff
  const segments = [];             // {x0,y0,x1,y1,t,strength}
  let segHead = 0;                 // first alive segment
  function buildInk() {
    ink = document.createElement('canvas');
    ink.width = Math.floor(W); ink.height = Math.floor(H);
    inkCtx = ink.getContext('2d');
    segments.length = 0;
    segHead = 0;
  }
  function stampInk(x0, y0, x1, y1, strength, now) {
    segments.push({ x0, y0, x1, y1, t: now, strength });
  }
  function drawInk(now) {
    while (segHead < segments.length && now - segments[segHead].t > MAX_AGE) segHead++;
    if (segHead > 4096) { segments.splice(0, segHead); segHead = 0; }
    inkCtx.clearRect(0, 0, W, H);
    inkCtx.globalCompositeOperation = 'lighter';
    inkCtx.lineCap = 'round';
    for (let i = segHead; i < segments.length; i++) {
      const s = segments[i];
      const age = now - s.t;
      const knee = age < KNEE ? 1 : 1 - (age - KNEE) / (MAX_AGE - KNEE);
      const k = s.strength * Math.exp(-CONFIG.inkFade * age) * knee;
      if (k < 0.008) continue;
      inkCtx.strokeStyle = `rgba(255, 214, 150, ${(0.20 * k).toFixed(3)})`;
      inkCtx.lineWidth = 9;
      inkCtx.beginPath(); inkCtx.moveTo(s.x0, s.y0); inkCtx.lineTo(s.x1, s.y1); inkCtx.stroke();
      inkCtx.strokeStyle = `rgba(255, 246, 224, ${(0.8 * k).toFixed(3)})`;
      inkCtx.lineWidth = 2.6;
      inkCtx.beginPath(); inkCtx.moveTo(s.x0, s.y0); inkCtx.lineTo(s.x1, s.y1); inkCtx.stroke();
    }
    inkCtx.globalCompositeOperation = 'source-over';
  }
  //  True while ink brighter than ~10% lingers inside a candidate
  //  word box — used to keep new words off still-burning ones.
  function inkVisibleIn(box, now) {
    for (let i = segHead; i < segments.length; i++) {
      const s = segments[i];
      if (Math.exp(-CONFIG.inkFade * (now - s.t)) < 0.10) continue;
      const mx = (s.x0 + s.x1) / 2, my = (s.y0 + s.y1) / 2;
      if (mx > box.x0 && mx < box.x1 && my > box.y0 && my < box.y1) return true;
    }
    return false;
  }

  // -------------------- sparkler state --------------------
  //  plan → fly → writing → flourish → hold → plan → …
  const sp = {
    state: 'plan',
    wordIdx: 0,
    wr: null,
    d: 0,
    x: -60, y: 0, px: -60, py: 0,   // enters from off-screen left
    t: 0,
    hold: 0,
    ember: 1,
    fly: null,          // {p0, p1, p2, T} for the swoop to the next word
    fx0: 0, fy0: 0,
  };

  function planWord(now) {
    const scale = rand(...CONFIG.wordScale);
    const unit = (H * CONFIG.glyphHeight) / 120 * scale;
    const word = CONFIG.words[sp.wordIdx % CONFIG.words.length];
    sp.wordIdx++;
    const placed = placeWord(word, unit, now);
    sp.wr = buildWord(word, placed.x, placed.y, unit);
    sp.d = 0;
    const start = pathPos(sp.wr, 0);
    // swoop to the word's first stroke along an arced flight path
    const dx = start.x - sp.x, dy = start.y - sp.y;
    const dist = Math.hypot(dx, dy) || 1;
    const nx = -dy / dist, ny = dx / dist;
    const bow = rand(-0.35, 0.35) * dist;
    sp.fly = {
      p0: { x: sp.x, y: sp.y },
      p1: { x: sp.x + dx * 0.5 + nx * bow, y: sp.y + dy * 0.5 + ny * bow - dist * 0.08 },
      p2: { x: start.x, y: start.y },
      T: Math.min(2.2, Math.max(0.8, dist / 380)),
    };
    sp.t = 0;
    sp.state = 'fly';
    sp.ember = Math.min(1, sp.ember + 0.5);
  }

  function stepSparkler(t, dt) {
    sp.t += dt;
    if (!sp.wr) { planWord(t); return; }

    if (sp.state === 'writing') {
      sp.d += CONFIG.writeSpeed * (0.92 + 0.16 * Math.sin(t * 3.1)) * dt * (sp.ember * 0.4 + 0.6);
      sp.ember = Math.min(1, sp.ember + dt * 1.4);
      const p = pathPos(sp.wr, sp.d);
      sp.px = sp.x; sp.py = sp.y;
      sp.x = p.x; sp.y = p.y;
      if (p.ink) stampInk(sp.px, sp.py, sp.x, sp.y, sp.ember, t);
      if (sp.d >= sp.wr.len) {
        sp.state = 'flourish';
        sp.t = 0;
        sp.hold = rand(...CONFIG.holdAfterWord);
        sp.fx0 = sp.x; sp.fy0 = sp.y;
      }
    } else if (sp.state === 'flourish') {
      // a small celebratory loop above the finished word
      const k = sp.t / 1.2;
      const r = H * 0.045;
      sp.px = sp.x; sp.py = sp.y;
      sp.x = sp.fx0 + Math.sin(k * Math.PI * 2.2) * r * 1.4;
      sp.y = sp.fy0 - Math.sin(k * Math.PI) * r * 1.1 - k * H * 0.02;
      sp.ember = Math.max(0.35, 1 - sp.t / 1.4);
      if (sp.t > 1.2) { sp.state = 'hold'; sp.t = 0; }
    } else if (sp.state === 'hold') {
      sp.px = sp.x; sp.py = sp.y;
      sp.ember = Math.max(0.25, sp.ember - dt * 0.4);
      if (sp.t > sp.hold) planWord(t);
    } else if (sp.state === 'fly') {
      const f = sp.fly;
      const u = Math.min(1, sp.t / f.T);
      const k = u * u * (3 - 2 * u);   // smoothstep ease
      const v = 1 - k;
      sp.px = sp.x; sp.py = sp.y;
      sp.x = v * v * f.p0.x + 2 * v * k * f.p1.x + k * k * f.p2.x;
      sp.y = v * v * f.p0.y + 2 * v * k * f.p1.y + k * k * f.p2.y;
      sp.ember = Math.min(1, sp.ember + dt * 0.8);
      if (u >= 1) {
        sp.state = 'writing';
        sp.d = 0;
        sp.fly = null;
      }
    }
  }

  // -------------------- sparks --------------------
  const MAX_SPARKS = 420;
  const sparks = [];
  for (let i = 0; i < MAX_SPARKS; i++) sparks.push({ x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, hue: 0 });
  let sparkCursor = 0;
  function emitSpark(x, y, vx0, vy0, vigor) {
    const s = sparks[sparkCursor++ % MAX_SPARKS];
    const a = rand(0, Math.PI * 2);
    const v = rand(24, 130) * vigor;
    s.x = x; s.y = y;
    s.vx = Math.cos(a) * v + vx0 * 0.25;
    s.vy = Math.sin(a) * v + vy0 * 0.25 - 16;
    s.life = s.max = rand(0.35, 1.05);
    s.hue = Math.random();
  }
  function stepSparks(t, dt) {
    for (const s of sparks) {
      if (s.life <= 0) continue;
      s.life -= dt;
      s.vy += 105 * dt;
      s.vx *= Math.exp(-1.15 * dt);
      s.vy *= Math.exp(-0.65 * dt);
      s.x += s.vx * dt;
      s.y += s.vy * dt;
    }
  }
  function drawSparks() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (const s of sparks) {
      if (s.life <= 0) continue;
      const k = s.life / s.max;
      const warm = s.hue < 0.7;
      ctx.strokeStyle = warm
        ? `rgba(255, ${(190 + 50 * k) | 0}, ${(120 + 90 * k) | 0}, ${(0.85 * k).toFixed(3)})`
        : `rgba(255, 246, 230, ${(0.9 * k).toFixed(3)})`;
      ctx.lineWidth = 1.3 * U + 0.7 * k;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - s.vx * 0.03, s.y - s.vy * 0.03);
      ctx.stroke();
    }
    ctx.restore();
  }

  // -------------------- head --------------------
  function drawHead(t) {
    if (sp.ember <= 0.01) return;
    const flick = 0.8 + 0.2 * Math.sin(t * 21) * Math.sin(t * 7.3);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const sz = 26 * U * (0.6 + sp.ember * 0.8) * flick;
    stampAt(ctx, glowWarm, sp.x, sp.y, sz * 3.4, 0.4 * sp.ember);
    stampAt(ctx, glowHot, sp.x, sp.y, sz * 1.5, 0.9 * sp.ember);
    ctx.fillStyle = `rgba(255, 250, 240, ${0.95 * sp.ember})`;
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, 1.9 * U, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // -------------------- ambient ember drift --------------------
  const motes = [];
  function buildMotes() {
    motes.length = 0;
    for (let i = 0; i < 26; i++) {
      motes.push({
        x: Math.random() * W, y: Math.random() * H,
        vy: -rand(4, 14), ph: rand(0, Math.PI * 2),
        s: rand(2, 5) * U, a: rand(0.04, 0.12),
      });
    }
  }
  function drawMotes(t, dt) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const m of motes) {
      m.y += m.vy * dt;
      m.x += Math.sin(t * 0.7 + m.ph) * 8 * dt;
      if (m.y < -10) { m.y = H + 10; m.x = Math.random() * W; }
      const tw = 0.6 + 0.4 * Math.sin(t * 1.7 + m.ph * 3);
      stampAt(ctx, glowWarm, m.x, m.y, m.s * 5, m.a * tw);
    }
    ctx.restore();
  }

  // -------------------- resize / build --------------------
  function resize() {
    DPR = Math.min(CONFIG.dprCap, window.devicePixelRatio || 1);
    W = Math.floor(window.innerWidth);
    H = Math.floor(window.innerHeight);
    U = W / 1600;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildInk();
    buildMotes();
    sp.wr = null;
    sp.wordIdx = 0;
    sp.state = 'plan';
    sp.t = 0;
    sp.x = sp.px = -60;
    sp.y = sp.py = H * rand(0.25, 0.75);
  }
  window.addEventListener('resize', resize, { passive: true });
  resize();

  // -------------------- loop --------------------
  let last = performance.now();
  let ready = false;

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const t = now / 1000;

    ctx.fillStyle = '#060508';
    ctx.fillRect(0, 0, W, H);

    stepSparkler(t, dt);

    if (sp.ember > 0.05) {
      const vigor = sp.state === 'writing' ? 1 : 0.8;
      const hvx = (sp.x - sp.px) / Math.max(dt, 1e-4);
      const hvy = (sp.y - sp.py) / Math.max(dt, 1e-4);
      const n = Math.max(1, Math.round(CONFIG.sparksPerFrame * sp.ember));
      for (let i = 0; i < n; i++) emitSpark(sp.x, sp.y, hvx, hvy, vigor);
    }

    drawInk(t);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(ink, 0, 0, W, H);
    ctx.restore();

    drawMotes(t, dt);
    stepSparks(t, dt);
    drawSparks();
    drawHead(t);

    if (!ready) { ready = true; document.body.classList.add('ready'); }
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
